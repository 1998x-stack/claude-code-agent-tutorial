<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>技能从发现、按需加载、注入到移除的生命周期</title><desc>发现只读名称与描述；命中任务后才把 SKILL.md 正文注入本轮上下文；任务切换时移除，避免长期占用预算。</desc><defs><marker id="a21" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">技能按需加载：只在命中任务时才注入正文</text><text x="30" y="68" font-size="14" fill="#53676d">发现阶段只持有元数据；注入有 token 上限；任务切换即移除。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="112" width="176" height="86" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="118" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Discover</text><text x="118" y="174" font-size="13.5" fill="#53676d" text-anchor="middle">扫描 SKILL.md</text><rect x="240" y="112" width="176" height="86" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="328" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Load</text><text x="328" y="174" font-size="13.5" fill="#53676d" text-anchor="middle">按相关度排序</text><rect x="450" y="112" width="176" height="86" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="538" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Inject</text><text x="538" y="174" font-size="13.5" fill="#53676d" text-anchor="middle">有界注入上下文</text><rect x="660" y="112" width="150" height="86" rx="12" fill="#eef5f2" stroke="#a9b8b4" stroke-width="1.6"/><text x="735" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Evict</text><text x="735" y="174" font-size="13.5" fill="#53676d" text-anchor="middle">任务切换移除</text><path d="M209 155H236" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a21)"/><path d="M419 155H446" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a21)"/><path d="M629 155H656" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a21)"/><rect x="30" y="236" width="780" height="150" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="268" font-size="17" font-weight="740" fill="#203035">预算与边界（教学设计）</text><text x="54" y="298" font-size="14.5" fill="#53676d">示例上限 8192 token：按相关度从高到低装入，直到装不下为止。</text><text x="54" y="324" font-size="14.5" fill="#53676d">正文包在 &lt;SKILL_CONTEXT&gt; 边界内，便于整体移除而不重写系统提示。</text><text x="54" y="356" font-size="14" fill="#c96442">技能正文不是授权：能否执行工具仍由平台权限策略在调用时判定。</text></g></svg>
