<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Skills 的两阶段上下文加载</title><desc>启动时发现可用技能的描述；调用时才载入 SKILL.md 正文及所需资源。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">Skills 的两阶段上下文加载</text><text x="30" y="68" font-size="14" fill="#53676d">启动时发现可用技能的描述；调用时才载入 SKILL.md 正文及所需资源。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="36" y="117" width="220" height="82" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="146" y="147" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Discover</text><text x="146" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">name + description</text><rect x="309" y="117" width="220" height="82" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="419" y="147" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Invoke</text><text x="419" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">user / model policy</text><rect x="582" y="117" width="220" height="82" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="692" y="147" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Load</text><text x="692" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">SKILL.md body + refs</text><path d="M260 158H304" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M533 158H577" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M692 201V255H146V201" fill="none" stroke="#147f80" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="418" y="248" font-size="14" text-anchor="middle" fill="#147f80">正文进入会话后可跨后续 turn 保留</text><rect x="34" y="291" width="772" height="94" rx="12" fill="#fff" stroke="#dce6e2"/><text x="56" y="321" font-size="17" font-weight="750" fill="#203035">权限与内容是两种生命周期</text><text x="56" y="350" font-size="14" fill="#53676d">allowed-tools 仅对调用该 Skill 的当前 turn 预授权；下一条用户消息后清除。</text><text x="56" y="372" font-size="14" fill="#c96a4a">没有官方“连续三轮工具分布变化就自动 Evict”的通用机制。</text></g></svg>