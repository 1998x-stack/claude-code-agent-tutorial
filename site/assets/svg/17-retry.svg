<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>一次沙箱拒绝之后，不应静默重试为非沙箱命令</title><desc>Claude Code 文档存在显式 unsandboxed retry 路径；高安全场景需禁用逃逸。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">一次沙箱拒绝之后，不应静默重试为非沙箱命令</text><text x="30" y="68" font-size="14" fill="#53676d">Claude Code 文档存在显式 unsandboxed retry 路径；高安全场景需禁用逃逸。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="32" y="112" width="228" height="82" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="146" y="141" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Sandboxed Run</text><text x="146" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">OS 拒绝受限资源</text><rect x="308" y="112" width="228" height="82" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="422" y="141" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Denied Effect</text><text x="422" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">网络主机 / 私密路径</text><rect x="583" y="112" width="226" height="82" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="696" y="141" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Stop or Review</text><text x="696" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">记录并请求人工判断</text><path d="M262 152H304" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M538 152H579" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><rect x="32" y="268" width="777" height="118" rx="12" fill="#fff" stroke="#dce6e2"/><text x="55" y="299" font-size="17" font-weight="750" fill="#203035">Fail-Closed 部署边界（官方 managed settings 示例）</text><text x=