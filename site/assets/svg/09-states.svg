<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>明确的任务状态机：先开始，再用证据完成</title><desc>pending → in_progress → completed / failed；不允许跳转成完成。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="29" y="42" font-size="23" font-weight="740" fill="#203035">明确的任务状态机：先开始，再用证据完成</text><text x="30" y="67" font-size="14" fill="#53676d">pending → in_progress → completed / failed；不允许跳转成完成。</text><path d="M30 83H809" stroke="#dce6e2"/><rect x="38" y="126" width="219" height="85" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.7"/><text x="147.5" y="158" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">PENDING</text><text x="147.5" y="185" text-anchor="middle" font-size="13.5" fill="#53676d">未运行 / 等依赖</text><rect x="315" y="126" width="219" height="85" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.7"/><text x="424.5" y="158" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">IN PROGRESS</text><text x="424.5" y="185" text-anchor="middle" font-size="13.5" fill="#53676d">正在执行</text><rect x="592" y="107" width="212" height="80" rx="12" fill="#e2f4e8" stroke="#4e956b" stroke-width="1.7"/><text x="698" y="139" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">COMPLETED</text><text x="698" y="166" text-anchor="middle" font-size="13.5" fill="#53676d">记录验收证据</text><rect x="592" y="242" width="212" height="80" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.7"/><text x="698" y="274" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">FAILED</text><text x="698" y="301" text-anchor="middle" font-size="13.5" fill="#53676d">保留失败原因</text><path d="M259 169H311" fill="none" stroke="#147f80" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M535 157H588" fill="none" stroke="#147f80" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M535 185L588 279" fill="none" stroke="#147f80" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="37" y="267" width="493" height="92" rx="11" fill="#fff" stroke="#dce6e2"/><text x="57" y="298" font-size="15.5" fill="#203035" font-weight="740">不可逆的教学简化</text><text x="57" y="325" font-size="14" fill="#53676d">失败需新建明确的修复任务；不会偷改状态为完成。</text><text x="57" y="347" font-size="14" fill="#53676d">单任务执行限制避免示例里共享状态竞态。</text></g></svg>