<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>会话时间线让慢工具与可并行调用一眼可见</title><desc>把模型调用与工具执行按时间排列：一个 Read 耗时异常长会阻塞后续；三次互不依赖的 Read 串行执行本可并行。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">时间线：把几十个回合压成一条可比较的轴</text><text x="30" y="68" font-size="14" fill="#53676d">横轴是耗时（教学示意），每个色块是一次调用或工具执行。</text><path d="M30 84H810" stroke="#dce6e2"/><text x="40" y="118" font-size="13.5" fill="#53676d">回合</text><text x="120" y="118" font-size="13.5" fill="#53676d">0s</text><text x="380" y="118" font-size="13.5" fill="#53676d">2s</text><text x="640" y="118" font-size="13.5" fill="#53676d">4s</text><path d="M30 128H810" stroke="#dce6e2"/><text x="40" y="162" font-size="13" fill="#203035">#1</text><rect x="120" y="146" width="240" height="22" rx="5" fill="#bde6df"/><text x="240" y="162" font-size="12.5" fill="#265049" text-anchor="middle">模型调用</text><rect x="364" y="146" width="60" height="22" rx="5" fill="#e3ddf4"/><text x="394" y="162" font-size="12" fill="#51478a" text-anchor="middle">Read</text><rect x="428" y="146" width="60" height="22" rx="5" fill="#e3ddf4"/><text x="458" y="162" font-size="12" fill="#51478a" text-anchor="middle">Read</text><rect x="492" y="146" width="60" height="22" rx="5" fill="#e3ddf4"/><text x="522" y="162" font-size="12" fill="#51478a" text-anchor="middle">Read</text><text x="560" y="162" font-size="12.5" fill="#c96442">三次无依赖却串行</text><text x="40" y="228" font-size="13" fill="#203035">#4</text><rect x="120" y="212" width="200" height="22" rx="5" fill="#bde6df"/><text x="220" y="228" font-size="12.5" fill="#265049" text-anchor="middle">模型调用</text><rect x="324" y="212" width="420" height="22" rx="5" fill="#f9dccb"/><text x="534" y="228" font-size="12.5" fill="#7d3e2a" text-anchor="middle">Bash（无超时，阻塞后续）</text><rect x="30" y="270" width="780" height="122" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="302" font-size="16.5" font-weight="740" fill="#203035">从时间线能直接提出的问题</text><text x="54" y="330" font-size="14" fill="#53676d">· 某个工具为什么远慢于同类？是否需要超时或异步？</text><text x="54" y="354" font-size="14" fill="#53676d">· 哪些调用互不依赖、本可并行，却被串行执行？</text><text x="54" y="378" font-size="14" fill="#53676d">· 某轮的模型时延为何异常高（负载还是提示过长）？</text><text x="54" y="400" font-size="12.5" fill="#c96442">图中耗时比例为教学示意，不代表真实实测数据。</text></g></svg>
