<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>上下文窗口必须为输出和不确定性预留空间</title><desc>教学假设：32k 总预算 − 4k 输出 − 2k 余量 = 26k 可用输入；并非 Claude 固定窗口。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="31" y="42" font-size="23" font-weight="740" fill="#203035">上下文窗口必须为输出和不确定性预留空间</text><text x="31" y="68" font-size="14" fill="#53676d">教学假设：32k 总预算 − 4k 输出 − 2k 余量 = 26k 可用输入；并非 Claude 固定窗口。</text><path d="M31 83H808" stroke="#dce6e2"/><text x="40" y="130" fill="#203035" font-size="17" font-weight="740">示例预算：32,000 token</text><rect x="40" y="156" width="750" height="93" rx="11" fill="#fff" stroke="#dce6e2"/><rect x="47" y="163" width="596" height="79" rx="7" fill="#bde6df"/><rect x="646" y="163" width="90" height="79" rx="7" fill="#f9dccb"/><rect x="739" y="163" width="44" height="79" rx="7" fill="#e3ddf4"/><text x="345" y="194" font-size="20" font-weight="750" text-anchor="middle" fill="#203035">输入 ≤ 26k</text><text x="345" y="219" font-size="13.5" text-anchor="middle" fill="#365c59">system + tools + history</text><text x="691" y="193" font-size="13" text-anchor="middle" fill="#7d3e2a">输出</text><text x="691" y="216" font-size="13" text-anchor="middle" fill="#7d3e2a">4k</text><text x="761" y="193" font-size="13" text-anchor="middle" fill="#51478a">余量</text><text x="761" y="216" font-size="13" text-anchor="middle" fill="#51478a">2k</text><rect x="40" y="289" width="750" height="87" rx="12" fill="#fff" stroke="#dce6e2"/><text x="62" y="319" font-size="16" fill="#203035" font-weight="740">我们自己的预警策略</text><text x="62" y="345" font-size="14" fill="#53676d">超过活跃输入限额的 80%（20.8k）先做 checkpoint；达到 26k 时阻止直接继续。</text><text x="62" y="365" font-size="13" fill="#c96442">80% 是本例可配置的阈值，不是官方 Claude Code 自动压缩阈值。</text></g></svg>