<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>28 章知识图谱：六个部分围绕一个演进主线</title><desc>从认知与准备、核心骨架、规划与上下文、安全与扩展，到高级主题与生态、前沿与收官，每部分解决一个核心问题。</desc><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">28 章不是 28 个孤岛，而是一条演进主线</text><text x="30" y="68" font-size="14" fill="#53676d">每部分回答一个问题，下一部分以前一部分为地基。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="106" width="250" height="88" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="50" y="138" font-size="15.5" font-weight="740" fill="#203035">1 认知与准备（01–02）</text><text x="50" y="164" font-size="13" fill="#53676d">Agent 的演进与证据分级</text><text x="50" y="184" font-size="13" fill="#53676d">可复现的研究环境</text><rect x="295" y="106" width="250" height="88" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="315" y="138" font-size="15.5" font-weight="740" fill="#203035">2 核心骨架（03–08）</text><text x="315" y="164" font-size="13" fill="#53676d">最小 Loop、工具层、协议</text><text x="315" y="184" font-size="13" fill="#53676d">提示分层、状态机主循环</text><rect x="560" y="106" width="250" height="88" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="580" y="138" font-size="15.5" font-weight="740" fill="#203035">3 规划与上下文（09–11）</text><text x="580" y="164" font-size="13" fill="#53676d">依赖 DAG、预算与压缩</text><text x="580" y="184" font-size="13" fill="#53676d">检查点与可靠恢复</text><rect x="30" y="208" width="250" height="88" rx="12" fill="#eef5f2" stroke="#a9b8b4" stroke-width="1.6"/><text x="50" y="240" font-size="15.5" font-weight="740" fill="#203035">4 安全与扩展（12–19）</text><text x="50" y="266" font-size="13" fill="#53676d">子代理隔离、权限网关</text><text x="50" y="286" font-size="13" fill="#53676d">沙箱边界、MCP 2026</text><rect x="295" y="208" width="250" height="88" rx="12" fill="#f3eefb" stroke="#7162ad" stroke-width="1.6"/><text x="315" y="240" font-size="15.5" font-weight="740" fill="#203035">5 高级与生态（20–25）</text><text x="315" y="266" font-size="13" fill="#53676d">Context Engineering、Skills</text><text x="315" y="286" font-size="13" fill="#53676d">完成模式、观测、生态与筛选</text><rect x="560" y="208" width="250" height="88" rx="12" fill="#fceee6" stroke="#c96442" stroke-width="1.6"/><text x="580" y="240" font-size="15.5" font-weight="740" fill="#203035">6 前沿与收官（26–28）</text><text x="580" y="266" font-size="13" fill="#53676d">长任务与跨会话状态</text><text x="580" y="286" font-size="13" fill="#53676d">完整装配与回顾</text><rect x="30" y="314" width="780" height="88" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="344" font-size="15.5" font-weight="740" fill="#203035">贯穿始终的三个判断</text><text x="54" y="372" font-size="14" fill="#53676d">① 区分官方契约 / 可观察行为 / 教学设计；② 副作用要审批与隔离；③ 结论要可复现。</text><text x="54" y="394" font-size="12.5" fill="#c96442">图中章节主题与仓库内已精修章节一致；“六部分”是教学分组，不是官方分类。</text></g></svg>
