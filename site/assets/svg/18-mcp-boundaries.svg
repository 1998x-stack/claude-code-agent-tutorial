<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>MCP 协议栈：消息、功能、传输和授权互不替代</title><desc>统一 JSON-RPC 不意味着任意工具自动可信；模型和宿主仍需审批与沙箱。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">MCP 协议栈：消息、功能、传输和授权互不替代</text><text x="30" y="68" font-size="14" fill="#53676d">统一 JSON-RPC 不意味着任意工具自动可信；模型和宿主仍需审批与沙箱。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="28" y="113" width="182" height="85" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="119" y="142" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">Agent / Host</text><text x="119" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">用户控制与审批</text><rect x="237" y="113" width="182" height="85" rx="11" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="328" y="142" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">Client</text><text x="328" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">tool registry / IDs</text><rect x="448" y="113" width="182" height="85" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.5"/><text x="539" y="142" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">MCP Transport</text><text x="539" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">stdio / HTTP</text><rect x="657" y="113" width="154" height="85" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="734" y="142" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">Server</text><text x="734" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">资源和工具</text><path d="M213 154H233" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M422 154H444" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M633 154H653" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M734 201V244H116V201" stroke="#147f80" stroke-dasharray="7 5" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="420" y="237" font-size="14" fill="#147f80" text-anchor="middle">JSON-RPC 响应、错误或需要额外输入</text><rect x="32" y="283" width="776" height="102" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="314" font-size="17" font-weight="740" fill="#203035">MCP 扩展的是能力接入，不是权限绕过</text><text x="54" y="344" font-size="14.5" fill="#53676d">工具注释来自服务器，仅是行为提示；未经信任的服务器必须将其视为不可信信息。</text></g></svg>