<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>缓存基于前缀匹配：头部稳定才可复用，中间插入会打断前缀</title><desc>稳定的系统提示与固定顺序的工具定义构成可复用前缀；把动态内容放进用户消息追加在末尾，缓存更易命中。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">缓存按前缀匹配：头部越稳，越容易复用</text><text x="30" y="68" font-size="14" fill="#53676d">同一会话中改变前缀，会让后面的内容全部重新处理。</text><path d="M30 84H810" stroke="#dce6e2"/><text x="46" y="116" font-size="14.5" font-weight="740" fill="#203035">好做法：稳定前缀 + 末尾追加</text><rect x="46" y="128" width="330" height="36" rx="6" fill="#bde6df"/><text x="211" y="151" font-size="13" fill="#265049" text-anchor="middle">系统提示（稳定）</text><rect x="380" y="128" width="330" height="36" rx="6" fill="#bde6df"/><text x="545" y="151" font-size="13" fill="#265049" text-anchor="middle">工具定义（顺序固定）</text><rect x="714" y="128" width="80" height="36" rx="6" fill="#f9dccb"/><text x="754" y="151" font-size="13" fill="#7d3e2a" text-anchor="middle">新增</text><path d="M46 176H794" stroke="#147f80" stroke-width="2" stroke-dasharray="7 5"/><text x="46" y="200" font-size="13" fill="#147f80">└ 整段前缀可命中缓存</text><text x="46" y="240" font-size="14.5" font-weight="740" fill="#203035">坏做法：往中间插入动态内容</text><rect x="46" y="252" width="240" height="36" rx="6" fill="#bde6df"/><text x="166" y="275" font-size="13" fill="#265049" text-anchor="middle">系统提示</text><rect x="290" y="252" width="120" height="36" rx="6" fill="#e3ddf4"/><text x="350" y="275" font-size="13" fill="#51478a" text-anchor="middle">插入</text><rect x="414" y="252" width="300" height="36" rx="6" fill="#f3d3c4"/><text x="564" y="275" font-size="13" fill="#7d3e2a" text-anchor="middle">工具定义 + 历史：前缀已被打断</text><rect x="46" y="310" width="748" height="86" rx="12" fill="#fff" stroke="#dce6e2"/><text x="68" y="340" font-size="16" font-weight="740" fill="#203035">命中率怎么算</text><text x="68" y="366" font-size="14" fill="#53676d">用响应里真实的缓存读/写字段除以输入总量；不要用单一含计数或经验常数。</text><text x="68" y="388" font-size="13" fill="#c96442">具体字段与计费规则以模型、平台和 SDK 版本的官方文档为准。</text></g></svg>
