<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>任务依赖是有向无环图，不是随意的清单</title><desc>只有全部前置任务完成，后续任务才进入 ready 集合。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="29" y="42" font-size="23" font-weight="740" fill="#203035">任务依赖是有向无环图，不是随意的清单</text><text x="30" y="67" font-size="14" fill="#53676d">只有全部前置任务完成，后续任务才进入 ready 集合。</text><path d="M30 83H809" stroke="#dce6e2"/><rect x="36" y="131" width="205" height="84" rx="12" fill="#e2f3ef" stroke="#147f80" stroke-width="1.7"/><text x="138.5" y="163" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">inspect</text><text x="138.5" y="190" text-anchor="middle" font-size="13.5" fill="#53676d">确认问题</text><rect x="319" y="131" width="205" height="84" rx="12" fill="#fff" stroke="#a6c9c2" stroke-width="1.7"/><text x="421.5" y="163" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">patch</text><text x="421.5" y="190" text-anchor="middle" font-size="13.5" fill="#53676d">修改最小范围</text><rect x="598" y="131" width="205" height="84" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.7"/><text x="700.5" y="163" text-anchor="middle" font-size="18" font-weight="720" fill="#203035">verify</text><text x="700.5" y="190" text-anchor="middle" font-size="13.5" fill="#53676d">验证验收</text><path d="M243 174H315" fill="none" stroke="#147f80" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M526 174H594" fill="none" stroke="#147f80" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="37" y="271" width="766" height="107" rx="12" fill="#fff" stroke="#dce6e2"/><text x="57" y="302" font-size="16" font-weight="730" fill="#203035">状态递推</text><text x="57" y="333" font-size="14.5" fill="#53676d">ready(patch) 当且仅当 inspect.status = completed；</text><text x="57" y="355" font-size="14.5" fill="#53676d">前置任务失败不会把依赖任务自动视为可运行。拓扑环会使验证失败。</text></g></svg>