<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>从中断恢复：比摘要更重要的是验证顺序</title><desc>通过校验、证据回读与新的模型请求恢复任务，而不是把“已完成”当真。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">从中断恢复：比摘要更重要的是验证顺序</text><text x="30" y="68" font-size="14" fill="#53676d">通过校验、证据回读与新的模型请求恢复任务，而不是把“已完成”当真。</text><path d="M30 83H810" stroke="#dce6e2"/><rect x="30" y="113" width="190" height="85" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="125" y="144" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">LOAD</text><text x="125" y="172" text-anchor="middle" font-size="13.3" fill="#53676d">读取检查点</text><rect x="238" y="113" width="190" height="85" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="333" y="144" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">VERIFY</text><text x="333" y="172" text-anchor="middle" font-size="13.3" fill="#53676d">schema + 摘要校验</text><rect x="446" y="113" width="190" height="85" rx="12" fill="#fff" stroke="#a7c9bf" stroke-width="1.5"/><text x="541" y="144" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">RECONCILE</text><text x="541" y="172" text-anchor="middle" font-size="13.3" fill="#53676d">复核证据与当前文件</text><rect x="654" y="113" width="156" height="85" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="732" y="144" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">RESUME</text><text x="732" y="172" text-anchor="middle" font-size="13.3" fill="#53676d">构造新上下文</text><path d="M222 155H235" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M430 155H443" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M638 155H650" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="29" y="263" width="781" height="111" rx="13" fill="#fff" stroke="#dce6e2"/><text x="53" y="292" font-size="17" font-weight="750" fill="#203035">失败分支必须可见</text><text x="53" y="324" font-size="14.5" fill="#53676d">哈希不匹配 → 停止；约束缺失 → 停止；文件已变化 → 重新确认，不自动继续写入。</text><text x="53" y="351" font-size="14.5" fill="#c96442">本例校验 SHA-256 只检测意外篡改，不提供认证、加密或可信审计。</text></g></svg>