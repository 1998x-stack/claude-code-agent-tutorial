<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>CLAUDE.md、AGENTS.md、Skills 属于不同加载机制</title><desc>默认项目指令选择受版本和设置影响；不要将三者混为“固定三层”。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">CLAUDE.md、AGENTS.md、Skills 属于不同加载机制</text><text x="30" y="68" font-size="14" fill="#53676d">默认项目指令选择受版本和设置影响；不要将三者混为“固定三层”。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="29" y="114" width="779" height="252" rx="14" fill="#fff" stroke="#dce6e2"/><rect x="53" y="140" width="187" height="52" rx="8" fill="#e1f3ef" stroke="#147f80"/><text x="147" y="172" text-anchor="middle" font-size="17" font-weight="740" fill="#203035">CLAUDE.md</text><text x="270" y="162" font-size="15.5" fill="#203035">项目指令 / 导入</text><text x="270" y="185" font-size="14" fill="#53676d">在约定作用域读取</text><rect x="53" y="209" width="187" height="52" rx="8" fill="#f1eef9" stroke="#7162ad"/><text x="147" y="241" text-anchor="middle" font-size="17" font-weight="740" fill="#203035">AGENTS.md</text><text x="270" y="231" font-size="15.5" fill="#203035">跨工具约定</text><text x="270" y="254" font-size="14" fill="#53676d">默认有条件读取</text><rect x="53" y="278" width="187" height="52" rx="8" fill="#fff0e8" stroke="#c96442"/><text x="147" y="310" text-anchor="middle" font-size="17" font-weight="740" fill="#203035">Skills</text><text x="270" y="300" font-size="15.5" fill="#203035">任务工作流</text><text x="270" y="323" font-size="14" fill="#53676d">调用时加载正文</text><text x="417" y="398" text-anchor="middle" font-size="14" fill="#53676d">默认情况下，工作目录及父目录存在对应 CLAUDE.md 时可能优先于 AGENTS.md。</text></g></svg>