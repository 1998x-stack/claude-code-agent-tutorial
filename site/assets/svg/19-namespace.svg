<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>多 MCP Server 的工具同名，不意味着它们是同一个工具</title><desc>Host 必须为服务器分配可信唯一 ID，工具路由应使用 server::name。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">多 MCP Server 的工具同名，不意味着它们是同一个工具</text><text x="30" y="68" font-size="14" fill="#53676d">Host 必须为服务器分配可信唯一 ID，工具路由应使用 server::name。</text><path d="M30 83H810" stroke="#dce6e2"/><rect x="30" y="115" width="213" height="80" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="136.5" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Server A</text><text x="136.5" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">tool: search</text><rect x="30" y="233" width="213" height="80" rx="11" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="136.5" y="263" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Server B</text><text x="136.5" y="291" text-anchor="middle" font-size="13.5" fill="#53676d">tool: search</text><rect x="316" y="167" width="205" height="80" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.5"/><text x="418.5" y="197" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Host Registry</text><text x="418.5" y="225" text-anchor="middle" font-size="13.5" fill="#53676d">按来源建立命名空间</text><rect x="600" y="113" width="205" height="80" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="702.5" y="143" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">alpha::search</text><text x="702.5" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">独立策略与审批</text><rect x="600" y="231" width="205" height="80" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="702.5" y="261" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">beta::search</text><text x="702.5" y="289" text-anchor="middle" font-size="13.5" fill="#53676d">不同权限与结果</text><path d="M246 154L310 196" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M246 273L310 218" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M524 192L595 152" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M524 220L595 269" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="420" y="375" text-anchor="middle" fill="#53676d" font-size="14">服务器自报 name 不一定唯一；别把“readOnlyHint”当作独立权限凭证。</text></g></svg>