<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>权限决策比一个真假开关更复杂</title><desc>官方 Agent SDK 权限处理涉及 Hook、deny、ask、mode、allow 与 callback。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">权限决策比一个真假开关更复杂</text><text x="30" y="68" font-size="14" fill="#53676d">官方 Agent SDK 权限处理涉及 Hook、deny、ask、mode、allow 与 callback。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="31" y="114" width="777" height="241" rx="12" fill="#fff" stroke="#dce6e2"/><rect x="49" y="151" width="106" height="81" rx="10" fill="#f1eef9" stroke="#c4d9d3"/><text x="102" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Hook</text><text x="102" y="206" text-anchor="middle" font-size="14" fill="#53676d">1</text><path d="M157 192H169" stroke="#147f80" stroke-width="2"/><rect x="172" y="151" width="106" height="81" rx="10" fill="#fff0e8" stroke="#c4d9d3"/><text x="225" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Deny</text><text x="225" y="206" text-anchor="middle" font-size="14" fill="#53676d">2</text><path d="M280 192H292" stroke="#147f80" stroke-width="2"/><rect x="295" y="151" width="106" height="81" rx="10" fill="#f1eef9" stroke="#c4d9d3"/><text x="348" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Ask</text><text x="348" y="206" text-anchor="middle" font-size="14" fill="#53676d">3</text><path d="M403 192H415" stroke="#147f80" stroke-width="2"/><rect x="418" y="151" width="106" height="81" rx="10" fill="#e5f3ef" stroke="#c4d9d3"/><text x="471" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Mode</text><text x="471" y="206" text-anchor="middle" font-size="14" fill="#53676d">4</text><path d="M526 192H538" stroke="#147f80" stroke-width="2"/><rect x="541" y="151" width="106" height="81" rx="10" fill="#e5f3ef" stroke="#c4d9d3"/><text x="594" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Allow</text><text x="594" y="206" text-anchor="middle" font-size="14" fill="#53676d">5</text><path d="M649 192H661" stroke="#147f80" stroke-width="2"/><rect x="664" y="151" width="106" height="81" rx="10" fill="#fff" stroke="#c4d9d3"/><text x="717" y="181" text-anchor="middle" font-size="15.5" font-weight="740" fill="#203035">Callback</text><text x="717" y="206" text-anchor="middle" font-size="14" fill="#53676d">6</text><text x="420" y="279" text-anchor="middle" font-size="15" fill="#203035">每一步可能允许、拒绝、询问或继续判断；部分审批有特例。</text><text x="420" y="317" text-anchor="middle" font-size="14" fill="#c96442">真实 SDK 的顺序与产品规则详见官方文档；此处不是源码逆向。</text><text x="420" y="392" text-anchor="middle" font-size="13.5" fill="#53676d">安全还需要 OS 沙箱、工作目录限制、审计及受管控设置。</text></g></svg>