<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Agent Loop 是带出口的有限状态机</title><desc>终止不是“只要不是 tool_use 就成功”：还需处理 token 上限、错误和步数预算。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 0 8Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="29" y="42" font-size="23" font-weight="750" fill="#203035">Agent Loop 是带出口的有限状态机</text><text x="30" y="68" font-size="14" fill="#53676d">终止不是“只要不是 tool_use 就成功”：还需处理 token 上限、错误和步数预算。</text><path d="M30 82H810" stroke="#dce6e2"/><rect x="38" y="110" width="210" height="78" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.7"/><text x="143" y="142" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">请求模型</text><text x="143" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">携带 messages</text><rect x="317" y="110" width="210" height="78" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.7"/><text x="422" y="142" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">检查停止原因</text><text x="422" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">stop_reason</text><rect x="592" y="110" width="210" height="78" rx="12" fill="#fff1e9" stroke="#c96442" stroke-width="1.7"/><text x="697" y="142" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">执行受控工具</text><text x="697" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">tool_use 分支</text><path d="M251 147H313" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#a)"/><path d="M530 147H588" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#a)"/><path d="M696 192V233H145V191" fill="none" stroke="#147f80" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="465" y="225" fill="#147f80" font-size="13">反馈结果 → 下一轮请求</text><rect x="85" y="286" width="223" height="77" rx="12" fill="#e7f5ee" stroke="#4c977c" stroke-width="1.7"/><text x="196.5" y="318" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">正常结束</text><text x="196.5" y="345" text-anchor="middle" font-size="13.5" fill="#53676d">end_turn</text><rect x="317" y="286" width="223" height="77" rx="12" fill="#f1eef8" stroke="#7162ad" stroke-width="1.7"/><text x="428.5" y="318" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">停止并报告</text><text x="428.5" y="345" text-anchor="middle" font-size="13.5" fill="#53676d">步数耗尽 / max_tokens</text><rect x="549" y="286" width="223" height="77" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.7"/><text x="660.5" y="318" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">错误路径</text><text x="660.5" y="345" text-anchor="middle" font-size="13.5" fill="#53676d">未知工具 / 超时</text><path d="M423 191V280" stroke="#147f80" stroke-width="2" stroke-dasharray="5 5"/><text x="415" y="396" text-anchor="middle" font-size="13.5" fill="#53676d">每个出口都有确定语义；不能把不完整响应当作最终成功。</text></g></svg>