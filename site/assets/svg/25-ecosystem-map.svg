<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Coding Agent 生态的能力层，不是简单的产品排行榜</title><desc>运行时、扩展机制、协议、评估和观测是互补的选择维度。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">Coding Agent 生态的能力层，不是简单的产品排行榜</text><text x="30" y="68" font-size="14" fill="#53676d">运行时、扩展机制、协议、评估和观测是互补的选择维度。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="112" width="238" height="78" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="149" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Agent Runtime</text><text x="149" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">Claude Code / Codex / Gemini</text><rect x="302" y="112" width="238" height="78" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="421" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Extensions</text><text x="421" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">Skills / Plugins / MCP / Hooks</text><rect x="574" y="112" width="236" height="78" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="692" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Evaluation</text><text x="692" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">SWE-bench / Task suites</text><path d="M270 151H297" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M542 151H569" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="248" width="238" height="78" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="149" y="277" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">SDK &amp; Frameworks</text><text x="149" y="305" text-anchor="middle" font-size="13.5" fill="#53676d">Agent SDK / OpenHands / Aider</text><rect x="302" y="248" width="238" height="78" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="421" y="277" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Observability</text><text x="421" y="305" text-anchor="middle" font-size="13.5" fill="#53676d">OpenTelemetry / traces</text><rect x="574" y="248" width="236" height="78" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="692" y="277" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Trust &amp; Governance</text><text x="692" y="305" text-anchor="middle" font-size="13.5" fill="#53676d">license / provenance / policy</text><path d="M420 192V220H149V244" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M420 192V244" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M420 220H692V244" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="420" y="382" text-anchor="middle" font-size="14" fill="#53676d">不同层可组合；选择时先明确你要构建、扩展、观测还是评估哪一部分。</text></g></svg>