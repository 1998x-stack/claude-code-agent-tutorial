<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>完成判定必须检查外部证据，不看自然语言的“我完成了”</title><desc>测试、diff review、需求验收与人类审批形成显式门禁。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">完成判定必须检查外部证据，不看自然语言的“我完成了”</text><text x="30" y="68" font-size="14" fill="#53676d">测试、diff review、需求验收与人类审批形成显式门禁。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="32" y="113" width="180" height="82" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="122" y="143" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Task Contract</text><text x="122" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">scope + checks</text><rect x="235" y="113" width="180" height="82" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="325" y="143" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Execution</text><text x="325" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">bounded steps</text><rect x="438" y="113" width="180" height="82" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="528" y="143" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Evidence</text><text x="528" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">tests / diff / artifact</text><rect x="641" y="113" width="167" height="82" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="724.5" y="143" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Approval</text><text x="724.5" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">when required</text><path d="M214 154H230" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M417 154H433" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M620 154H636" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M724 199V246H121V199" stroke="#147f80" stroke-width="2.3" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="420" y="239" font-size="14" text-anchor="middle" fill="#147f80">失败或证据缺失 → 修复 / 补证据；预算耗尽 → 停止并升级</text><rect x="32" y="283" width="776" height="93" rx="12" fill="#fff" stroke="#dce6e2"/><text x="55" y="314" font-size="17" font-weight="750" fill="#203035">模型输出“done”不是成功证据</text><text x="55" y="345" font-size="14" fill="#53676d">完成判定来自可验证验收条件；有副作用的任务还需要可信人类批准。</text></g></svg>