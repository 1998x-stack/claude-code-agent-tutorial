<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>一次 Agent 任务的因果链：API 请求、工具决策和工具结果</title><desc>request_id 与 tool_use_id 把不同信号关联起来；父子 Span 用 trace_id/span_id 连接。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">一次 Agent 任务的因果链：API 请求、工具决策和工具结果</text><text x="30" y="68" font-size="14" fill="#53676d">request_id 与 tool_use_id 把不同信号关联起来；父子 Span 用 trace_id/span_id 连接。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="286" y="109" width="268" height="68" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="420" y="138" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">API Request</text><text x="420" y="166" text-anchor="middle" font-size="13.5" fill="#53676d">trace_id + request_id</text><rect x="55" y="235" width="218" height="76" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="164" y="264" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Tool Decision</text><text x="164" y="292" text-anchor="middle" font-size="13.5" fill="#53676d">accept / reject</text><rect x="311" y="235" width="218" height="76" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="420" y="264" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Tool Result</text><text x="420" y="292" text-anchor="middle" font-size="13.5" fill="#53676d">success / failure</text><rect x="567" y="235" width="218" height="76" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="676" y="264" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Next API Request</text><text x="676" y="292" text-anchor="middle" font-size="13.5" fill="#53676d">continues trace</text><path d="M420 179V208H164V231" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M420 179V231" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M420 208H676V231" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="420" y="365" font-size="14" fill="#53676d" text-anchor="middle">拒绝调用：记录 tool_decision；不会生成 tool_result。</text><text x="420" y="389" font-size="14" fill="#c96a4a" text-anchor="middle">只记关联 ID 与摘要，不把提示词、参数、结果正文写入默认遥测。</text></g></svg>