<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>压缩不能丢掉任务约束与未完成事项</title><desc>先整理完成的历史，再保存关键事实、未解决问题与证据索引；替换需要审计。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="31" y="42" font-size="23" font-weight="740" fill="#203035">压缩不能丢掉任务约束与未完成事项</text><text x="31" y="68" font-size="14" fill="#53676d">先整理完成的历史，再保存关键事实、未解决问题与证据索引；替换需要审计。</text><path d="M31 83H808" stroke="#dce6e2"/><rect x="32" y="111" width="340" height="247" rx="13" fill="#fff" stroke="#dce6e2"/><text x="55" y="142" font-size="18" font-weight="740" fill="#203035">长历史（示例）</text><rect x="55" y="163" width="296" height="27" rx="6" fill="#dce6e2"/><text x="71" y="181" font-size="14.5" fill="#203035">日志 / 大段输出</text><rect x="55" y="196" width="296" height="27" rx="6" fill="#e7f3f0"/><text x="71" y="214" font-size="14.5" fill="#203035">已完成工具结果</text><rect x="55" y="229" width="296" height="27" rx="6" fill="#f4e7e0"/><text x="71" y="247" font-size="14.5" fill="#203035">约束 / 用户目标</text><rect x="55" y="262" width="296" height="27" rx="6" fill="#f1eef9"/><text x="71" y="280" font-size="14.5" fill="#203035">尚未验证的任务</text><rect x="55" y="295" width="296" height="27" rx="6" fill="#e7f3f0"/><text x="71" y="313" font-size="14.5" fill="#203035">源文件 / 证据路径</text><path d="M378 240H461" fill="none" stroke="#147f80" stroke-width="3"/><path d="M450 233L463 240 450 247" fill="none" stroke="#147f80" stroke-width="3"/><rect x="474" y="111" width="334" height="247" rx="13" fill="#e7f4f1" stroke="#147f80"/><text x="494" y="142" font-size="18" font-weight="740" fill="#203035">结构化 checkpoint</text><rect x="495" y="163" width="288" height="27" rx="6" fill="#c8e6df"/><text x="507" y="181" font-size="14" fill="#203035">任务目标与不可变约束</text><rect x="495" y="196" width="288" height="27" rx="6" fill="#fff"/><text x="507" y="214" font-size="14" fill="#203035">已验证事实与来源</text><rect x="495" y="229" width="288" height="27" rx="6" fill="#f5e6e0"/><text x="507" y="247" font-size="14" fill="#203035">待办、阻塞与风险</text><rect x="495" y="262" width="288" height="27" rx="6" fill="#fff"/><text x="507" y="280" font-size="14" fill="#203035">最近必要的原始消息</text><rect x="495" y="295" width="288" height="27" rx="6" fill="#fff"/><text x="507" y="313" font-size="14" fill="#203035">可恢复的证据索引</text><text x="420" y="392" text-anchor="middle" font-size="13.5" fill="#53676d">摘要可能失真；必须核对关键事实，不能破坏 tool_use / tool_result 关联关系。</text></g></svg>