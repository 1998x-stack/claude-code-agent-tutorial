<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426" role="img"><title>对 Claude Code 主张建立证据阶梯</title><desc>从可公开检索的说明到可重现实验，再到明确标注的推断</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147f80"/></marker><marker id="arroworange" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c96442"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,-apple-system,PingFang SC,Arial,sans-serif"><text x="33" y="42" font-size="23" font-weight="750" fill="#203035">为什么“能观察到”不等于“知道源码如何写”</text><text x="34" y="69" font-size="14" fill="#53676d">每种证据都有适用范围；越靠近官方规范，越可以被外部复核</text><path d="M33 83H807" stroke="#dce6e2"/><path d="M80 355H760" stroke="#dce6e2" stroke-width="2"/><rect x="44" y="257" width="234" height="84" rx="13" fill="#fff1e9" stroke="#c96442" stroke-width="1.5"/><text x="161" y="291" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">设计假设</text><text x="161" y="318" text-anchor="middle" font-size="13.5" fill="#53676d">用于解释，不当产品事实</text><rect x="303" y="181" width="234" height="84" rx="13" fill="#f1eef8" stroke="#7162ad" stroke-width="1.5"/><text x="420" y="215" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">可观察行为</text><text x="420" y="242" text-anchor="middle" font-size="13.5" fill="#53676d">命令/结果 + 版本</text><rect x="562" y="105" width="234" height="84" rx="13" fill="#e1f3ef" stroke="#147f80" stroke-width="1.5"/><text x="679" y="139" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">官方公开契约</text><text x="679" y="166" text-anchor="middle" font-size="13.5" fill="#53676d">规范、接口和出处</text><path d="M280 299L328 263 M539 221L585 189" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><text x="80" y="395" font-size="14" fill="#53676d">每条文章结论都要注明归属层级、时间、版本及可核对的来源。</text></g></svg>