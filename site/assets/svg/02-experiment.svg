<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426" role="img"><title>黑盒观察实验的可复核记录</title><desc>以普通 CLI/API 功能作为研究对象，不依赖私有代码或敏感数据</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147f80"/></marker><marker id="arroworange" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c96442"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,-apple-system,PingFang SC,Arial,sans-serif"><text x="33" y="42" font-size="23" font-weight="750" fill="#203035">可靠实验需要四份记录</text><text x="34" y="69" font-size="14" fill="#53676d">输入条件、可见输出、版本边界和可能的替代解释</text><path d="M33 83H807" stroke="#dce6e2"/><rect x="39" y="116" width="177" height="95" rx="13" fill="#e7f4f2" stroke="#147f80" stroke-width="1.5"/><text x="127.5" y="150" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">环境</text><text x="127.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">系统 / CLI 版本</text><rect x="243" y="116" width="177" height="95" rx="13" fill="#fff" stroke="#a7c9c3" stroke-width="1.5"/><text x="331.5" y="150" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">操作</text><text x="331.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">公开命令与请求</text><rect x="447" y="116" width="177" height="95" rx="13" fill="#f1eef8" stroke="#7162ad" stroke-width="1.5"/><text x="535.5" y="150" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">输出</text><text x="535.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">日志 / 状态码</text><rect x="651" y="116" width="150" height="95" rx="13" fill="#fff1e9" stroke="#c96442" stroke-width="1.5"/><text x="726" y="150" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">证据</text><text x="726" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">复现 / 边界</text><path d="M218 162 L240 162" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M422 162 L444 162" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M626 162 L648 162" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="39" y="258" width="762" height="112" rx="12" fill="#fff" stroke="#dce6e2"/><text x="59" y="286" font-size="17" fill="#203035" font-weight="700">一个安全的研究样本</text><text x="59" y="318" font-size="14" fill="#53676d">记录 claude --version → 版本字符串；公开文档的行为 → 实际表现；差异 → 归档为待核查项。</text><text x="59" y="343" font-size="14" fill="#53676d">不采集密钥，不截获其他人的流量，不假设打包代码等于获授权的可用源码。</text></g></svg>