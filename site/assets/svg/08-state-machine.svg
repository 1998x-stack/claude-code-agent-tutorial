<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Agent Loop 的控制状态必须显式分叉</title><desc>工具调用继续循环；最终回答、截断、取消和预算用不同出口表示。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="43" font-size="23" font-weight="740" fill="#203035">Agent Loop 的控制状态必须显式分叉</text><text x="30" y="68" font-size="14" fill="#53676d">工具调用继续循环；最终回答、截断、取消和预算用不同出口表示。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="116" width="190" height="70" rx="11" fill="#e7f3f0" stroke="#147f80" stroke-width="1.6"/><text x="125" y="145" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">REQUEST</text><text x="125" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">发送完整历史</text><rect x="262" y="116" width="190" height="70" rx="11" fill="#e7f3f0" stroke="#147f80" stroke-width="1.6"/><text x="357" y="145" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">CLASSIFY</text><text x="357" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">读取 stop_reason</text><rect x="499" y="116" width="164" height="70" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="581" y="145" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">TOOLS</text><text x="581" y="171" text-anchor="middle" font-size="13.5" fill="#53676d">执行并配对结果</text><path d="M223 150H258" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/><path d="M454 150H495" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/><path d="M580 189V227H135V189" stroke="#147f80" stroke-width="2.7" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="374" y="220" font-size="13.5" fill="#147f80">tool_result → 下一轮</text><rect x="30" y="280" width="225" height="75" rx="11" fill="#eaf7ee" stroke="#5b9c7b" stroke-width="1.6"/><text x="142.5" y="309" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">FINAL</text><text x="142.5" y="335" text-anchor="middle" font-size="13.5" fill="#53676d">end_turn</text><rect x="305" y="280" width="225" height="75" rx="11" fill="#f1eef8" stroke="#7162ad" stroke-width="1.6"/><text x="417.5" y="309" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">HALT</text><text x="417.5" y="335" text-anchor="middle" font-size="13.5" fill="#53676d">max_tokens / error</text><rect x="580" y="280" width="225" height="75" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="692.5" y="309" text-anchor="middle" font-size="17.5" font-weight="730" fill="#203035">CANCEL</text><text x="692.5" y="335" text-anchor="middle" font-size="13.5" fill="#53676d">用户中止 / 轮次上限</text><path d="M351 188V273" stroke="#147f80" stroke-width="2.2" stroke-dasharray="5 5"/><text x="420" y="394" fill="#53676d" text-anchor="middle" font-size="14">只有完成分支可以标记 success；其他分支必须保留终止原因。</text></g></svg>