<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Prompt Cache：为什么静态前缀很重要</title><desc>同一前缀适合复用；改变前面的内容会改变匹配基础。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" fill="#203035" font-weight="750" font-size="23">Prompt Cache：为什么静态前缀很重要</text><text x="30" y="68" fill="#53676d" font-size="14">同一前缀适合复用；改变前面的内容会改变匹配基础。</text><path d="M30 82H810" stroke="#dce6e2"/><rect x="37" y="116" width="766" height="100" rx="11" fill="#fff" stroke="#dce6e2"/><text x="57" y="142" font-size="15" font-weight="750" fill="#203035">请求 A</text><rect x="54" y="157" width="254" height="35" rx="6" fill="#bde5de"/><rect x="312" y="157" width="224" height="35" rx="6" fill="#e7e4f7"/><rect x="540" y="157" width="245" height="35" rx="6" fill="#f8dccd"/><text x="181" y="180" text-anchor="middle" font-size="13.5" fill="#203035">稳定工具 + system</text><text x="424" y="180" text-anchor="middle" font-size="13.5" fill="#203035">项目上下文</text><text x="661" y="180" text-anchor="middle" font-size="13.5" fill="#203035">动态任务</text><rect x="37" y="234" width="766" height="100" rx="11" fill="#fff" stroke="#dce6e2"/><text x="57" y="260" font-size="15" font-weight="750" fill="#203035">请求 B</text><rect x="54" y="276" width="254" height="35" rx="6" fill="#bde5de"/><rect x="312" y="276" width="224" height="35" rx="6" fill="#e7e4f7"/><rect x="540" y="276" width="245" height="35" rx="6" fill="#f8dccd"/><text x="181" y="299" text-anchor="middle" font-size="13.5" fill="#203035">稳定工具 + system</text><text x="424" y="299" text-anchor="middle" font-size="13.5" fill="#203035">项目上下文</text><text x="661" y="299" text-anchor="middle" font-size="13.5" fill="#203035">另一任务</text><path d="M52 354H536" stroke="#147f80" stroke-width="3"/><text x="294" y="379" text-anchor="middle" font-size="14" fill="#147f80">匹配的静态前缀</text><text x="664" y="379" text-anchor="middle" font-size="14" fill="#c96442">新的动态片段</text></g></svg>