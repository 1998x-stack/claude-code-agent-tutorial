<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>提示内容与执行权限是两条线</title><desc>应用层规则、项目约定与按需知识不应该混淆为模型的独立执行授权。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" fill="#203035" font-weight="750" font-size="23">提示内容与执行权限是两条线</text><text x="30" y="68" fill="#53676d" font-size="14">应用层规则、项目约定与按需知识不应该混淆为模型的独立执行授权。</text><path d="M30 82H810" stroke="#dce6e2"/><rect x="32" y="106" width="232" height="78" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="148" y="136" text-anchor="middle" font-size="18" fill="#203035" font-weight="730">应用级系统约束</text><text x="148" y="164" text-anchor="middle" font-size="13.5" fill="#53676d">稳定、安全边界</text><rect x="302" y="106" width="232" height="78" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="418" y="136" text-anchor="middle" font-size="18" fill="#203035" font-weight="730">项目约定</text><text x="418" y="164" text-anchor="middle" font-size="13.5" fill="#53676d">代码风格与架构约束</text><rect x="572" y="106" width="236" height="78" rx="12" fill="#fff1e8" stroke="#c96442" stroke-width="1.6"/><text x="690" y="136" text-anchor="middle" font-size="18" fill="#203035" font-weight="730">选中的 Skill</text><text x="690" y="164" text-anchor="middle" font-size="13.5" fill="#53676d">当前任务所需流程</text><path d="M145 188V231H686V188" stroke="#147f80" stroke-width="2.5" fill="none"/><rect x="141" y="255" width="558" height="73" rx="13" fill="#fff" stroke="#dce6e2"/><text x="420" y="284" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">组装请求 → 模型生成提议</text><text x="420" y="312" text-anchor="middle" font-size="14" fill="#53676d">宿主权限引擎另行决定工具是否执行</text><text x="420" y="372" text-anchor="middle" fill="#c96442" font-size="14">此为教学 Prompt Builder，不对应 Claude Code 私有 Prompt 顺序</text></g></svg>