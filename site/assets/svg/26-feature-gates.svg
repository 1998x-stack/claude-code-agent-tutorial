<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>长时运行状态机：默认未通过、可中止、可人工转向</title><desc>只有可信评估者可以提交通过证据；人工停止优先于继续工作。</desc><defs><marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">长时运行状态机：默认未通过、可中止、可人工转向</text><text x="30" y="68" font-size="14" fill="#53676d">只有可信评估者可以提交通过证据；人工停止优先于继续工作。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="34" y="121" width="168" height="86" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="118" y="150" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Pending</text><text x="118" y="178" text-anchor="middle" font-size="13.5" fill="#53676d">no evidence</text><rect x="236" y="121" width="168" height="86" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="320" y="150" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">In Progress</text><text x="320" y="178" text-anchor="middle" font-size="13.5" fill="#53676d">attempt budget</text><rect x="438" y="121" width="168" height="86" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="522" y="150" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Verified</text><text x="522" y="178" text-anchor="middle" font-size="13.5" fill="#53676d">artifact + acceptance</text><rect x="640" y="121" width="168" height="86" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="724" y="150" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Blocked</text><text x="724" y="178" text-anchor="middle" font-size="13.5" fill="#53676d">retry / review</text><path d="M206 163H231" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#flow)"/><path d="M408 163H433" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#flow)"/><path d="M610 163H635" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#flow)"/><path d="M718 215V253H118V215" fill="none" stroke="#c96a4a" stroke-width="2.2" stroke-dasharray="7 4"/><text x="418" y="249" font-size="13.5" text-anchor="middle" fill="#c96a4a">失败可重试；超过上限进入 blocked，等待人工复核</text><rect x="32" y="285" width="776" height="101" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="315" font-size="17" font-weight="750" fill="#203035">两条横切控制通道</text><text x="54" y="345" font-size="14" fill="#53676d">Steering：人类变更优先级 / 约束，记录在独立审计日志。</text><text x="54" y="369" font-size="14" fill="#c96a4a">Kill switch：停止新工作；恢复须检查 checkpoint 摘要与工作区 revision。</text></g></svg>