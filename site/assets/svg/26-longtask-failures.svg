<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>短任务假设在长任务上失效的四种方式</title><desc>上下文腐烂、状态漂移、决策质量下降与错误累积：任务时间拉长后依次暴露，需要外部证据与跨会话检查点。</desc><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">任务从分钟拉到小时后，四个问题依次浮出</text><text x="30" y="68" font-size="14" fill="#53676d">共同根因：把“状态”放在易失的上下文里，而不是可审计的外部工件里。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="108" width="378" height="110" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="52" y="140" font-size="16" font-weight="740" fill="#203035">上下文腐烂</text><text x="52" y="168" font-size="13.5" fill="#53676d">早期决策被新信息挤到边缘，被截断或稀释</text><text x="52" y="196" font-size="13" fill="#c96442">后果：与更早的约定自相矛盾</text><rect x="432" y="108" width="378" height="110" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="454" y="140" font-size="16" font-weight="740" fill="#203035">状态漂移</text><text x="454" y="168" font-size="13.5" fill="#53676d">“已完成”的记录与代码库真实状态脱节</text><text x="454" y="196" font-size="13" fill="#c96442">后果：以错误前提继续施工</text><rect x="30" y="232" width="378" height="110" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="52" y="264" font-size="16" font-weight="740" fill="#203035">决策质量下降</text><text x="52" y="292" font-size="13.5" fill="#53676d">越往后越倾向“最快”而非“最好”的方案</text><text x="52" y="320" font-size="13" fill="#c96442">后果：技术债在长任务里滚雪球</text><rect x="432" y="232" width="378" height="110" rx="12" fill="#eef5f2" stroke="#a9b8b4" stroke-width="1.6"/><text x="454" y="264" font-size="16" font-weight="740" fill="#203035">错误累积</text><text x="454" y="292" font-size="13.5" fill="#53676d">小错误没有立即被发现，被后续步骤放大复合</text><text x="454" y="320" font-size="13" fill="#c96442">后果：上层工作整体报废</text><rect x="30" y="356" width="780" height="46" rx="10" fill="#fff" stroke="#dce6e2"/><text x="52" y="384" font-size="13.5" fill="#53676d">对抗思路：把关键状态写到磁盘（检查点、Git），并用独立评估验证结果，而非信任对话记忆。</text></g></svg>
