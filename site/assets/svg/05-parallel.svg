<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>一次 assistant 响应包含多个工具调用</title><desc>工具可能同时出现，但每个结果都要匹配；是否并行执行是宿主策略选择。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="22" font-weight="750" fill="#203035">一次 assistant 响应包含多个工具调用</text><text x="31" y="68" font-size="13.5" fill="#53676d">工具可能同时出现，但每个结果都要匹配；是否并行执行是宿主策略选择。</text><path d="M31 83H809" stroke="#dce6e2"/><rect x="307" y="105" width="227" height="74" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="420.5" y="136" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">assistant 响应</text><text x="420.5" y="162" fill="#53676d" text-anchor="middle" font-size="13.5">text + tool_use A/B</text><rect x="59" y="229" width="210" height="75" rx="11" fill="#fff0e9" stroke="#c96442" stroke-width="1.6"/><text x="164" y="260" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">工具 A</text><text x="164" y="286" fill="#53676d" text-anchor="middle" font-size="13.5">验证输入 → 执行</text><rect x="314" y="229" width="210" height="75" rx="11" fill="#f1eef8" stroke="#7162ad" stroke-width="1.6"/><text x="419" y="260" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">工具 B</text><text x="419" y="286" fill="#53676d" text-anchor="middle" font-size="13.5">验证输入 → 执行</text><rect x="571" y="229" width="210" height="75" rx="11" fill="#e3f2ef" stroke="#147f80" stroke-width="1.6"/><text x="676" y="260" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">收集结果</text><text x="676" y="286" fill="#53676d" text-anchor="middle" font-size="13.5">工具 ID 全部匹配</text><path d="M367 181L164 225" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M420 181V225" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M526 265H567" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M268 268V326H677V305" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="83" y="348" width="674" height="49" rx="9" fill="#fff" stroke="#dce6e2"/><text x="420" y="379" text-anchor="middle" fill="#203035" font-size="14.5">生成一条 user 消息，包含 result(A) 和 result(B)；失败的工具也有结果。</text></g></svg>