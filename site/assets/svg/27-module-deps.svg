<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>模块依赖单向：入口依赖主循环，主循环依赖各子模块</title><desc>main 只负责装配；主循环依赖工具注册、规划、上下文、子代理、权限、MCP、技能；可观测性是所有模块共用的横切关注点。</desc><defs><marker id="a27" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">单向依赖：入口只装配，主循环只编排</text><text x="30" y="68" font-size="14" fill="#53676d">子模块之间不互相调用；可观测性被所有模块共用，是唯一的横切点。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="330" y="104" width="180" height="54" rx="10" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="420" y="137" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">main / CLI</text><rect x="330" y="188" width="180" height="54" rx="10" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="420" y="221" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">AgentLoop</text><path d="M420 158V186" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a27)"/><rect x="40" y="286" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="115" y="314" font-size="13" fill="#203035" text-anchor="middle">工具注册</text><rect x="204" y="286" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="279" y="314" font-size="13" fill="#203035" text-anchor="middle">Todo 规划</text><rect x="368" y="286" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="443" y="314" font-size="13" fill="#203035" text-anchor="middle">上下文管理</text><rect x="532" y="286" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="607" y="314" font-size="13" fill="#203035" text-anchor="middle">子代理</text><rect x="40" y="344" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="115" y="372" font-size="13" fill="#203035" text-anchor="middle">权限链</text><rect x="204" y="344" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="279" y="372" font-size="13" fill="#203035" text-anchor="middle">MCP 集成</text><rect x="368" y="344" width="150" height="46" rx="9" fill="#fff" stroke="#a9b8b4"/><text x="443" y="372" font-size="13" fill="#203035" text-anchor="middle">Skills</text><rect x="532" y="344" width="150" height="46" rx="9" fill="#fff0e8" stroke="#c96442"/><text x="607" y="372" font-size="13" fill="#7d3e2a" text-anchor="middle">可观测性（横切）</text><path d="M420 242V266H115V284" stroke="#147f80" stroke-width="1.6" fill="none" marker-end="url(#a27)"/><path d="M420 242V266H607V284" stroke="#147f80" stroke-width="1.6" fill="none" marker-end="url(#a27)"/><text x="470" y="262" font-size="12.5" fill="#53676d">主循环持有各子模块的接口，而非反过来</text></g></svg>
