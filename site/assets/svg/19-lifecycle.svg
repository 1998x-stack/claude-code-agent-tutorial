<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>发现 → 授权 → 编码 → 调用 → 验证 → 反馈</title><desc>工具注册不能只拿名字；Schema、来源、请求 ID 和失败路径均需记录。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">发现 → 授权 → 编码 → 调用 → 验证 → 反馈</text><text x="30" y="68" font-size="14" fill="#53676d">工具注册不能只拿名字；Schema、来源、请求 ID 和失败路径均需记录。</text><path d="M30 83H810" stroke="#dce6e2"/><rect x="27" y="144" width="143" height="84" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="98.5" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">1. Discover</text><text x="98.5" y="202" text-anchor="middle" font-size="13.5" fill="#53676d">tools/list（分页）</text><rect x="189" y="144" width="143" height="84" rx="11" fill="#f1eef9" stroke="#147f80" stroke-width="1.5"/><text x="260.5" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">2. Register</text><text x="260.5" y="202" text-anchor="middle" font-size="13.5" fill="#53676d">server::tool 唯一化</text><rect x="351" y="144" width="143" height="84" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.5"/><text x="422.5" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">3. Approve</text><text x="422.5" y="202" text-anchor="middle" font-size="13.5" fill="#53676d">宿主独立权限</text><rect x="513" y="144" width="143" height="84" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="584.5" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">4. Call</text><text x="584.5" y="202" text-anchor="middle" font-size="13.5" fill="#53676d">JSON-RPC + _meta</text><rect x="675" y="144" width="143" height="84" rx="11" fill="#f1eef9" stroke="#147f80" stroke-width="1.5"/><text x="746.5" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">5. Verify</text><text x="746.5" y="202" text-anchor="middle" font-size="13.5" fill="#53676d">resultType / isError</text><path d="M172 183H186" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M334 183H348" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M496 183H510" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M658 183H672" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="27" y="272" width="783" height="108" rx="12" fill="#fff" stroke="#dce6e2"/><text x="50" y="302" font-size="17" font-weight="750" fill="#203035">协议错误 vs 工具失败 vs input_required</text><text x="50" y="330" font-size="14.5" fill="#53676d">协议 error → 记录错误；isError → 工具业务失败；input_required → 等待真实额外输入。</text><text x="50" y="358" font-size="14" fill="#c96442">这些状态都不能在未验证时被归并成“执行成功”。</text></g></svg>