<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>一次工具循环的消息时序</title><desc>关键：assistant 原响应先进入历史，再用一条 user 消息返回所有工具结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 0 8Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="29" y="42" font-size="23" font-weight="750" fill="#203035">一次工具循环的消息时序</text><text x="30" y="68" font-size="14" fill="#53676d">关键：assistant 原响应先进入历史，再用一条 user 消息返回所有工具结果。</text><path d="M30 82H810" stroke="#dce6e2"/><rect x="34" y="114" width="183" height="77" rx="12" fill="#fff" stroke="#a7c9c3" stroke-width="1.7"/><text x="125.5" y="146" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">用户请求</text><text x="125.5" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">role=user</text><rect x="329" y="114" width="183" height="77" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.7"/><text x="420.5" y="146" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">模型响应</text><text x="420.5" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">role=assistant</text><rect x="625" y="114" width="180" height="77" rx="12" fill="#fff1e9" stroke="#c96442" stroke-width="1.7"/><text x="715" y="146" text-anchor="middle" font-size="18" font-weight="730" fill="#203035">工具执行</text><text x="715" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">本地受控函数</text><path d="M219 150H325" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#a)"/><path d="M515 150H622" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#a)"/><path d="M713 193V235H418V194" fill="none" stroke="#147f80" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="580" y="227" font-size="13" fill="#147f80">tool_result 返回</text><rect x="37" y="269" width="768" height="111" rx="12" fill="#fff" stroke="#dce6e2"/><text x="59" y="294" font-size="16" font-weight="750" fill="#203035">会话历史追加顺序</text><text x="59" y="326" font-size="15" fill="#203035">① user(task) → ② assistant(完整 content，包括 tool_use)</text><text x="59" y="356" font-size="15" fill="#203035">③ user([对应各 tool_use_id 的 tool_result]) → ④ 下一次模型请求</text></g></svg>