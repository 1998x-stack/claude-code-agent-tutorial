<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>从任务到退出：生命周期上的关键门禁</title><desc>每个阶段都有可观察输出，不能省略工具校验和结束条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="22" font-weight="750" fill="#203035">从任务到退出：生命周期上的关键门禁</text><text x="31" y="68" font-size="13.5" fill="#53676d">每个阶段都有可观察输出，不能省略工具校验和结束条件。</text><path d="M31 83H809" stroke="#dce6e2"/><rect x="29" y="110" width="178" height="77" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="118" y="141" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">装配上下文</text><text x="118" y="167" fill="#53676d" text-anchor="middle" font-size="13.5">目标 + 已知状态</text><rect x="237" y="110" width="178" height="77" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="326" y="141" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">请求模型</text><text x="326" y="167" fill="#53676d" text-anchor="middle" font-size="13.5">API 响应/工具建议</text><rect x="445" y="110" width="178" height="77" rx="11" fill="#f1eef8" stroke="#7162ad" stroke-width="1.6"/><text x="534" y="141" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">检查策略</text><text x="534" y="167" fill="#53676d" text-anchor="middle" font-size="13.5">允许 / 询问 / 拒绝</text><rect x="653" y="110" width="160" height="77" rx="11" fill="#fff0e9" stroke="#c96442" stroke-width="1.6"/><text x="733" y="141" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">执行工具</text><text x="733" y="167" fill="#53676d" text-anchor="middle" font-size="13.5">记录结果</text><path d="M209 148H233" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M417 148H441" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M625 148H649" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M728 190V229H328V190" fill="none" stroke="#147f80" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="525" y="222" text-anchor="middle" font-size="13.5" fill="#147f80">反馈观察 / 继续决策</text><rect x="71" y="282" width="328" height="80" rx="11" fill="#e9f6f0" stroke="#529578" stroke-width="1.6"/><text x="235" y="313" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">最终答复</text><text x="235" y="339" fill="#53676d" text-anchor="middle" font-size="13.5">end_turn + 验收信息</text><rect x="443" y="282" width="328" height="80" rx="11" fill="#fff0e9" stroke="#c96442" stroke-width="1.6"/><text x="607" y="313" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">受控停止</text><text x="607" y="339" fill="#53676d" text-anchor="middle" font-size="13.5">预算 / 取消 / 错误 / 拒绝</text><text x="420" y="399" text-anchor="middle" font-size="13.5" fill="#53676d">图上循环是编排逻辑；产品可能以不同的组件划分实现相同行为。</text></g></svg>