<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>有界轻推循环：最多轻推 N 次后就停下并报告未完成</title><desc>模型回复无工具调用且命中叙述模式时补一条轻推消息，计数加一；达到上限仍未行动就结束并如实报告，不伪造完成。</desc><defs><marker id="a22b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">轻推循环必须有硬上限</text><text x="30" y="68" font-size="14" fill="#53676d">目标是把“只叙述不行动”拉回执行，而不是无限重试。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="44" y="116" width="196" height="74" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="142" y="148" font-size="15.5" font-weight="740" fill="#203035" text-anchor="middle">模型本轮回复</text><text x="142" y="172" font-size="13" fill="#53676d" text-anchor="middle">无 tool_use</text><rect x="300" y="116" width="200" height="74" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="400" y="148" font-size="15.5" font-weight="740" fill="#203035" text-anchor="middle">命中叙述模式？</text><text x="400" y="172" font-size="13" fill="#53676d" text-anchor="middle">nudge &lt; max</text><rect x="560" y="116" width="236" height="74" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="678" y="148" font-size="15.5" font-weight="740" fill="#203035" text-anchor="middle">补一条轻推后重试</text><text x="678" y="172" font-size="13" fill="#53676d" text-anchor="middle">计数 +1</text><path d="M244 153H296" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a22b)"/><path d="M504 153H556" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a22b)"/><path d="M678 196V250H142V194" stroke="#147f80" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#a22b)"/><text x="410" y="242" font-size="13" fill="#53676d" text-anchor="middle">重新调用（回到循环）</text><rect x="44" y="268" width="752" height="122" rx="12" fill="#fff" stroke="#dce6e2"/><text x="66" y="300" font-size="16.5" font-weight="740" fill="#203035">达到 max_nudge 仍未产生工具调用</text><text x="66" y="330" font-size="14.5" fill="#53676d">停止循环，返回“未完成 / 需要人工介入”，并保留已发生的工具结果作为证据。</text><text x="66" y="358" font-size="14" fill="#c96442">不要用“模型说完成了”覆盖这一事实；写入类任务要用测试判定（见第 26 章）。</text><text x="66" y="382" font-size="13" fill="#53676d">max_nudge 取 2–3 是教学建议，应随任务与模型实测调整。</text></g></svg>
