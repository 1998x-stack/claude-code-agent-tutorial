<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>两次工具调用与 API 消息历史：ID 不能丢</title><desc>每轮保留完整 assistant.content；tool_result 在下一条 user 消息中按 ID 对应。</desc><defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">两次工具调用与 API 消息历史：ID 不能丢</text><text x="30" y="68" font-size="14" fill="#53676d">每轮保留完整 assistant.content；tool_result 在下一条 user 消息中按 ID 对应。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="34" y="115" width="238" height="84" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="153" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Assistant tool_use</text><text x="153" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">id=call-read / ReadFile</text><rect x="318" y="115" width="238" height="84" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="437" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">User tool_result</text><text x="437" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">tool_use_id=call-read</text><rect x="602" y="115" width="205" height="84" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="704.5" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Next assistant</text><text x="704.5" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">tool_use / end_turn</text><path d="M276 158H313" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M560 158H597" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><rect x="34" y="255" width="774" height="131" rx="12" fill="#fff" stroke="#dce6e2"/><text x="56" y="283" fill="#203035" font-size="17" font-weight="750">必须保持的协议不变量</text><text x="56" y="312" fill="#53676d" font-size="14">① 先附加完整 assistant block（包括工具调用 ID 和文本块）。</text><text x="56" y="340" fill="#53676d" font-size="14">② 一个 assistant 响应含多 tool_use 时，收集全部匹配 tool_result。</text><text x="56" y="367" fill="#c96a4a" font-size="14">③ 重复/未知 ID、工具拒绝、预算耗尽都不能被静默标成成功。</text></g></svg>