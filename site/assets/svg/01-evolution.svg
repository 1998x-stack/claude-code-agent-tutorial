<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426" role="img"><title>从补全到行动：反馈闭环何时出现</title><desc>对比一次性代码建议与使用外部工具、观察结果并重试的 Coding Agent</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147f80"/></marker><marker id="arroworange" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c96442"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,-apple-system,PingFang SC,Arial,sans-serif"><text x="33" y="42" font-size="23" font-weight="750" fill="#203035">模型生成代码 ≠ 拥有执行反馈的 Agent</text><text x="34" y="69" font-size="14" fill="#53676d">左侧一次输出，右侧将环境观察纳入下一轮决策</text><path d="M33 83H807" stroke="#dce6e2"/><rect x="36" y="120" width="216" height="92" rx="13" fill="#fff" stroke="#a9c8c0" stroke-width="1.5"/><text x="144" y="154" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">代码补全</text><text x="144" y="181" text-anchor="middle" font-size="13.5" fill="#53676d">输入 → 一次性建议</text><rect x="315" y="120" width="216" height="92" rx="13" fill="#e7f4f2" stroke="#147f80" stroke-width="1.5"/><text x="423" y="154" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">模型决策</text><text x="423" y="181" text-anchor="middle" font-size="13.5" fill="#53676d">提出下一步动作</text><rect x="590" y="120" width="210" height="92" rx="13" fill="#fff1e9" stroke="#c96442" stroke-width="1.5"/><text x="695" y="154" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">工具与环境</text><text x="695" y="181" text-anchor="middle" font-size="13.5" fill="#53676d">读取 / 测试 / 报错</text><path d="M254 165 L311 165" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M532 165 L585 165" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M692 214V273H420V215" stroke="#147f80" stroke-width="3" fill="none" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="550" y="268" text-anchor="middle" font-size="14" fill="#147f80">返回可观测结果</text><rect x="40" y="307" width="760" height="76" rx="11" fill="#fff" stroke="#dce6e2"/><text x="61" y="338" font-size="16" fill="#203035" font-weight="700">核心差别</text><text x="61" y="363" font-size="14" fill="#53676d">能否基于真实执行结果改变计划，并在权限与成本预算下停止循环。没有工具反馈只是建议生成。</text></g></svg>