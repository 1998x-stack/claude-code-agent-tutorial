<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Bash 防护至少需要政策、操作系统边界和执行审计</title><desc>“用正则识别危险命令”不能替代文件、网络、资源限制。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">Bash 防护至少需要政策、操作系统边界和执行审计</text><text x="30" y="68" font-size="14" fill="#53676d">“用正则识别危险命令”不能替代文件、网络、资源限制。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="29" y="115" width="181" height="86" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="119.5" y="144" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Request</text><text x="119.5" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">Shell 命令意图</text><rect x="232" y="115" width="181" height="86" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="322.5" y="144" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Permission</text><text x="322.5" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">人类授权 / deny</text><rect x="435" y="115" width="181" height="86" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="525.5" y="144" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">OS Sandbox</text><text x="525.5" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">文件 + 网络边界</text><rect x="638" y="115" width="172" height="86" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="724" y="144" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Observability</text><text x="724" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">退出 / 限额 / 失败</text><path d="M213 158H228" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M416 158H431" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M619 158H634" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><rect x="30" y="277" width="780" height="107" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="309" font-size="17" font-weight="750" fill="#203035">权限回答：能不能试；沙箱回答：运行后能碰哪里</text><text x="54" y="340" font-size="14.5" fill="#53676d">即便使用 argv 且 shell=False，程序仍可能访问敏感文件或外部网络。</text><text x="54" y="363" font-size="14" fill="#c96442">此章只检查预期副作用清单，绝不启动 Shell；真实隔离必须由 OS 提供。</text></g></svg>