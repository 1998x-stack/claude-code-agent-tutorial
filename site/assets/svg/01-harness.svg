<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426" role="img"><title>Harness 不是模型的同义词</title><desc>将模型能力与组织执行的工程基础设施明确区分</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147f80"/></marker><marker id="arroworange" markerWidth="8" markerHeight="8" refX="7.3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c96442"/></marker></defs><rect width="840" height="426" rx="16" fill="#f7faf8"/><g font-family="system-ui,-apple-system,PingFang SC,Arial,sans-serif"><text x="33" y="42" font-size="23" font-weight="750" fill="#203035">同一个模型，可搭配不同的 Harness</text><text x="34" y="69" font-size="14" fill="#53676d">差异主要来自工具边界、状态与验证，而非把模型名称写成 Agent</text><path d="M33 83H807" stroke="#dce6e2"/><rect x="33" y="110" width="774" height="260" rx="15" fill="#fff" stroke="#dce6e2"/><rect x="53" y="139" width="150" height="91" rx="13" fill="#e6f3f1" stroke="#147f80" stroke-width="1.5"/><text x="128" y="173" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">任务入口</text><text x="128" y="200" text-anchor="middle" font-size="13.5" fill="#53676d">目标与范围</text><rect x="248" y="139" width="150" height="91" rx="13" fill="#f1eef8" stroke="#7162ad" stroke-width="1.5"/><text x="323" y="173" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">状态管理</text><text x="323" y="200" text-anchor="middle" font-size="13.5" fill="#53676d">会话与任务</text><rect x="443" y="139" width="150" height="91" rx="13" fill="#e6f3f1" stroke="#147f80" stroke-width="1.5"/><text x="518" y="173" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">模型请求</text><text x="518" y="200" text-anchor="middle" font-size="13.5" fill="#53676d">推理与工具建议</text><rect x="638" y="139" width="150" height="91" rx="13" fill="#fff1e9" stroke="#c96442" stroke-width="1.5"/><text x="713" y="173" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">执行结果</text><text x="713" y="200" text-anchor="middle" 