<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>规则优先级：deny → ask → allow</title><desc>匹配到拒绝的调用不得被更细的允许规则覆盖。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">规则优先级：deny → ask → allow</text><text x="30" y="68" font-size="14" fill="#53676d">匹配到拒绝的调用不得被更细的允许规则覆盖。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="27" y="117" width="179" height="78" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.7"/><text x="116.5" y="147" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">DENY</text><text x="116.5" y="173" font-size="13.5" fill="#53676d" text-anchor="middle">最高优先</text><rect x="237" y="117" width="179" height="78" rx="11" fill="#f1eef9" stroke="#7162ad" stroke-width="1.7"/><text x="326.5" y="147" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">ASK</text><text x="326.5" y="173" font-size="13.5" fill="#53676d" text-anchor="middle">需要审批</text><rect x="447" y="117" width="179" height="78" rx="11" fill="#e3f3ee" stroke="#147f80" stroke-width="1.7"/><text x="536.5" y="147" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">ALLOW</text><text x="536.5" y="173" font-size="13.5" fill="#53676d" text-anchor="middle">预先允许</text><rect x="657" y="117" width="155" height="78" rx="11" fill="#fff" stroke="#a6c9c0" stroke-width="1.7"/><text x="734.5" y="147" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">DEFAULT</text><text x="734.5" y="173" font-size="13.5" fill="#53676d" text-anchor="middle">按模式处理</text><path d="M208 154H233" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M418 154H443" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M628 154H653" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="29" y="273" width="782" height="114" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="304" font-size="17" font-weight="740" fill="#203035">例：deny = Bash(git push *)，allow = Bash(git *)</text><text x="54" y="335" font-size="14.5" fill="#53676d">同一命令同时匹配两条规则，deny 仍然优先；不能通过更具体的 allow 覆写。</text><text x="54" y="360" font-size="13.5" fill="#c96442">此图只解释公开规则优先级；代码示例不解析 CLI 的复杂通配符规则。</text></g></svg>