<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>三层日志分别回答不同问题，面向不同受众</title><desc>API 层记录每次模型调用的 token、延迟与 stop_reason；工具层记录参数、结果与耗时；系统层记录权限、缓存与生命周期事件。</desc><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">三层日志：一次会话被拆成三种可查询的流</text><text x="30" y="68" font-size="14" fill="#53676d">每层用同一时间轴对齐，便于跨步骤追踪根因。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="108" width="780" height="88" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="52" y="140" font-size="17" font-weight="740" fill="#203035">API 层</text><text x="52" y="166" font-size="13.5" fill="#53676d">输入/输出 token（含缓存读写）、延迟、stop_reason、模型版本</text><text x="52" y="188" font-size="13" fill="#c96442">回答：模型在做什么、花了多少算力</text><rect x="30" y="208" width="780" height="88" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="52" y="240" font-size="17" font-weight="740" fill="#203035">工具层</text><text x="52" y="266" font-size="13.5" fill="#53676d">工具名、参数、结果长度、耗时、错误码、对应的 tool_use_id</text><text x="52" y="288" font-size="13" fill="#c96442">回答：工具执行对不对、瓶颈在哪</text><rect x="30" y="308" width="780" height="88" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="52" y="340" font-size="17" font-weight="740" fill="#203035">系统层</text><text x="52" y="366" font-size="13.5" fill="#53676d">权限决策、缓存事件、压缩事件、子代理生命周期</text><text x="52" y="388" font-size="13" fill="#c96442">回答：Harness 内部发生了什么</text></g></svg>
