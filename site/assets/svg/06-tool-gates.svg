<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>模型提出行动，不等于行动获得授权</title><desc>Tool Use 是请求；执行器需要经过独立策略门禁并反馈结果。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="16" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">模型提出行动，不等于行动获得授权</text><text x="30" y="67" font-size="14" fill="#53676d">Tool Use 是请求；执行器需要经过独立策略门禁并反馈结果。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="114" width="190" height="75" rx="12" fill="#e1f3ef" stroke="#147f80" stroke-width="1.5"/><text x="125" y="143" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">模型 tool_use</text><text x="125" y="167" text-anchor="middle" font-size="13" fill="#53676d">名称 + 参数</text><rect x="251" y="114" width="190" height="75" rx="12" fill="#fff" stroke="#a6c9c2" stroke-width="1.5"/><text x="346" y="143" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">参数校验</text><text x="346" y="167" text-anchor="middle" font-size="13" fill="#53676d">Schema + 路径边界</text><rect x="472" y="114" width="155" height="75" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="549.5" y="143" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">权限策略</text><text x="549.5" y="167" text-anchor="middle" font-size="13" fill="#53676d">允许 / 拒绝</text><rect x="657" y="114" width="150" height="75" rx="12" fill="#fff0e9" stroke="#c96442" stroke-width="1.5"/><text x="732" y="143" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">执行器</text><text x="732" y="167" text-anchor="middle" font-size="13" fill="#53676d">隔离 + 限额</text><path d="M221 149H247" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M442 149H468" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M629 149H653" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M731 192V234H114V191" stroke="#147f80" stroke-dasharray="7 5" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="420" y="226" text-anchor="middle" fill="#147f80" font-size="14">执行结果 / 拒绝原因 → tool_result</text><rect x="33" y="280" width="773" height="105" rx="11" fill="#fff" stroke="#dce6e2"/><text x="55" y="310" font-size="17" font-weight="700" fill="#203035">“安全”不能只靠提示词</text><text x="55" y="340" font-size="15" fill="#53676d">无论模型多么确信，宿主程序都必须决定哪些路径可读、哪些修改可写。</text><text x="55" y="365" font-size="14" fill="#53676d">本章 BashPreview 仅模拟 pwd / ls，不执行真实 Shell，也不构成操作系统沙箱。</text></g></svg>