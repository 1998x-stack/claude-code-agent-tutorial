<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>将执行进度变成结构化事件，而不是日志字符串</title><desc>我们的生成器在完成一次模型请求之后发出事件；不是 API Token Delta 的流式解析。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="43" font-size="23" font-weight="740" fill="#203035">将执行进度变成结构化事件，而不是日志字符串</text><text x="30" y="68" font-size="14" fill="#53676d">我们的生成器在完成一次模型请求之后发出事件；不是 API Token Delta 的流式解析。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="31" y="110" width="780" height="250" rx="14" fill="#fff" stroke="#dce6e2"/><circle cx="69" cy="142" r="14" fill="#def1ed" stroke="#147f80"/><text x="69" y="147" text-anchor="middle" font-size="13" font-weight="750" fill="#203035">1</text><rect x="111" y="125" width="231" height="34" rx="7" fill="#eaf5f2"/><text x="128" y="147" fill="#203035" font-size="15" font-weight="730">request</text><text x="374" y="147" font-size="14" fill="#53676d">model call started</text><circle cx="69" cy="184" r="14" fill="#def1ed" stroke="#147f80"/><text x="69" y="189" text-anchor="middle" font-size="13" font-weight="750" fill="#203035">2</text><rect x="111" y="167" width="231" height="34" rx="7" fill="#eaf5f2"/><text x="128" y="189" fill="#203035" font-size="15" font-weight="730">tool_result</text><text x="374" y="189" font-size="14" fill="#53676d">tool t1: ok</text><circle cx="69" cy="226" r="14" fill="#def1ed" stroke="#147f80"/><text x="69" y="231" text-anchor="middle" font-size="13" font-weight="750" fill="#203035">3</text><rect x="111" y="209" width="231" height="34" rx="7" fill="#eaf5f2"/><text x="128" y="231" fill="#203035" font-size="15" font-weight="730">tool_result</text><text x="374" y="231" font-size="14" fill="#53676d">tool t2: error</text><circle cx="69" cy="268" r="14" fill="#def1ed" stroke="#147f80"/><text x="69" y="273" text-anchor="middle" font-size="13" font-weight="750" fill="#203035">4</text><rect x="111" y="251" width="231" height="34" rx="7" fill="#eaf5f2"/><text x="128" y="273" fill="#203035" font-size="15" font-weight="730">request</text><text x="374" y="273" font-size="14" fill="#53676d">next model call</text><circle cx="69" cy="310" r="14" fill="#f9e4d8" stroke="#147f80"/><text x="69" y="315" text-anchor="middle" font-size="13" font-weight="750" fill="#203035">5</text><rect x="111" y="293" width="231" height="34" rx="7" fill="#fff0e8"/><text x="128" y="315" fill="#203035" font-size="15" font-weight="730">final / halt</text><text x="374" y="315" font-size="14" fill="#53676d">one terminal event</text><path d="M69 160V169M69 202V211M69 244V253M69 286V295" stroke="#147f80" stroke-width="2.3"/><text x="420" y="394" fill="#53676d" text-anchor="middle" font-size="14">消费者可以用事件刷新 CLI / UI / 追踪记录，但不能把“事件已发出”当作模型已完成。</text></g></svg>