<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>MCP 2025 与 2026：从会话握手转向逐请求元数据</title><desc>2026-07-28 是正式规范，不再要求 initialize；兼容旧客户端必须明确分版本。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">MCP 2025 与 2026：从会话握手转向逐请求元数据</text><text x="30" y="68" font-size="14" fill="#53676d">2026-07-28 是正式规范，不再要求 initialize；兼容旧客户端必须明确分版本。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="28" y="112" width="379" height="258" rx="13" fill="#fff" stroke="#dce6e2"/><rect x="432" y="112" width="379" height="258" rx="13" fill="#fff" stroke="#dce6e2"/><text x="217" y="147" text-anchor="middle" font-size="19" font-weight="750" fill="#6e589f">Legacy ≤ 2025-11-25</text><text x="623" y="147" text-anchor="middle" font-size="19" font-weight="750" fill="#147f80">Modern ≥ 2026-07-28</text><rect x="55" y="166" width="325" height="32" rx="7" fill="#f1eef9"/><text x="217" y="188" text-anchor="middle" font-size="14.5" fill="#203035">initialize → result</text><rect x="55" y="207" width="325" height="32" rx="7" fill="#f1eef9"/><text x="217" y="229" text-anchor="middle" font-size="14.5" fill="#203035">notifications/initialized</text><rect x="55" y="248" width="325" height="32" rx="7" fill="#f7faf8"/><text x="217" y="270" text-anchor="middle" font-size="14.5" fill="#203035">tools/list</text><rect x="55" y="289" width="325" height="32" rx="7" fill="#f7faf8"/><text x="217" y="311" text-anchor="middle" font-size="14.5" fill="#203035">tools/call</text><rect x="456" y="166" width="330" height="32" rx="7" fill="#e5f3ef"/><text x="621" y="188" text-anchor="middle" font-size="14.5" fill="#203035">server/discover（可选）</text><rect x="456" y="207" width="330" height="32" rx="7" fill="#e5f3ef"/><text x="621" y="229" text-anchor="middle" font-size="14.5" fill="#203035">tools/list + request _meta</text><rect x="456" y="248" width="330" height="32" rx="7" fill="#f7faf8"/><text x="621" y="270" text-anchor="middle" font-size="14.5" fill="#203035">tools/call + request _meta</text><rect x="456" y="289" width="330" height="32" rx="7" fill="#f7faf8"/><text x="621" y="311" text-anchor="middle" font-size="14.5" fill="#203035">resultType: complete / input_required</text><text x="420" y="400" text-anchor="middle" font-size="13.5" fill="#53676d">实际能力、版本与兼容性以客户端与服务器协商结果为准；不要混用报文。</text></g></svg>