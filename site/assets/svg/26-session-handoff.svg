<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>跨上下文长任务：工作证据不依赖模型的短期记忆</title><desc>首次初始化建立可验证任务清单；每个工作会话只完成一小块并交接。</desc><defs><marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">跨上下文长任务：工作证据不依赖模型的短期记忆</text><text x="30" y="68" font-size="14" fill="#53676d">首次初始化建立可验证任务清单；每个工作会话只完成一小块并交接。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="28" y="120" width="235" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="145.5" y="149" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Initializer</text><text x="145.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">features.json + init + git</text><rect x="303" y="120" width="235" height="85" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="420.5" y="149" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Coding Session</text><text x="420.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">one feature / clean state</text><rect x="578" y="120" width="235" height="85" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="695.5" y="149" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Independent Eval</text><text x="695.5" y="177" text-anchor="middle" font-size="13.5" fill="#53676d">tests + browser + evidence</text><path d="M266 163H298" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#flow)"/><path d="M541 163H573" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#flow)"/><path d="M695 211V258H165V211" fill="none" stroke="#147f80" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#flow)"/><text x="420" y="245" font-size="14" fill="#147f80" text-anchor="middle">新会话：先读取进度、feature 状态与 git，再选择下一项</text><rect x="28" y="292" width="784" height="96" rx="12" fill="#fff" stroke="#dce6e2"/><text x="52" y="323" font-size="17" font-weight="750" fill="#203035">三个独立状态载体</text><text x="52" y="354" font-size="14" fill="#53676d">对话 Session ≠ 工作区文件 ≠ 外部验收记录；恢复时必须逐项核对。</text><text x="52" y="378" font-size="14" fill="#c96a4a">不能凭生成器自报“完成”而将未经测试的 feature 改为 passed。</text></g></svg>