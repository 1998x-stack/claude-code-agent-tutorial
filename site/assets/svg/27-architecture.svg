<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>最小 Coding Agent：把模型建议与文件修改隔开</title><desc>当前示例支持只读 ReadFile 和生成统一补丁；没有 Bash、Write、Edit 或后台进程。</desc><defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">最小 Coding Agent：把模型建议与文件修改隔开</text><text x="30" y="68" font-size="14" fill="#53676d">当前示例支持只读 ReadFile 和生成统一补丁；没有 Bash、Write、Edit 或后台进程。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="118" width="177" height="83" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="118.5" y="148" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">User Task</text><text x="118.5" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">goal + workspace</text><rect x="238" y="118" width="177" height="83" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="326.5" y="148" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Model API</text><text x="326.5" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">tool_use blocks</text><rect x="446" y="118" width="177" height="83" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="534.5" y="148" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Tool Router</text><text x="534.5" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">validate + workspace</text><rect x="654" y="118" width="156" height="83" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="732" y="148" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Result</text><text x="732" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">tool_result IDs</text><path d="M211 160H233" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M419 160H441" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M628 160H649" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M724 205V254H321V205" fill="none" stroke="#147f80" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="521" y="247" fill="#147f80" font-size="14" text-anchor="middle">结果关联 tool_use_id 后送回模型，直到 end_turn / stop</text><rect x="30" y="290" width="780" height="96" rx="12" fill="#fff" stroke="#dce6e2"/><text x="53" y="322" fill="#203035" font-size="17" font-weight="750">位于 Agent 之外的最后一关</text><text x="53" y="351" fill="#53676d" font-size="14">独立执行测试、审查 diff、人工批准后才能进入真正的写入/发布工作流。</text><text x="53" y="373" fill="#c96a4a" font-size="14">模型的 end_turn 只代表本轮回答结束，不代表代码已修改或验收通过。</text></g></svg>