<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>三种完成信号的判定位置不同</title><desc>隐式完成把“不再调用工具”当作结束；显式完成要求调用完成工具；自适应完成再用轻推检测器判断是叙述还是总结。</desc><defs><marker id="a22" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">完成信号由谁判定：模型、工具协议，还是 Harness</text><text x="30" y="68" font-size="14" fill="#53676d">同一段回复，被当作“结束”还是“预告”，取决于 Harness 读哪个信号。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="112" width="240" height="120" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="150" y="146" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">隐式完成</text><text x="150" y="176" font-size="13.5" fill="#53676d" text-anchor="middle">回复里没有 tool_use</text><text x="150" y="200" font-size="13.5" fill="#53676d" text-anchor="middle">就当作本轮结束</text><text x="150" y="222" font-size="13" fill="#c96442" text-anchor="middle">依赖模型行为一致</text><rect x="300" y="112" width="240" height="120" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="420" y="146" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">显式完成</text><text x="420" y="176" font-size="13.5" fill="#53676d" text-anchor="middle">必须调用 finish 工具</text><text x="420" y="200" font-size="13.5" fill="#53676d" text-anchor="middle">或返回结构化结果</text><text x="420" y="222" font-size="13" fill="#c96442" text-anchor="middle">可审计，但更死板</text><rect x="570" y="112" width="240" height="120" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="690" y="146" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">自适应完成</text><text x="690" y="176" font-size="13.5" fill="#53676d" text-anchor="middle">先判定是叙述还是总结</text><text x="690" y="200" font-size="13.5" fill="#53676d" text-anchor="middle">必要时补一条轻推</text><text x="690" y="222" font-size="13" fill="#c96442" text-anchor="middle">启发式，会误判</text><rect x="30" y="262" width="780" height="130" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="294" font-size="17" font-weight="740" fill="#203035">共同约束：任何完成判定都必须可终止且有界（教学设计）</text><text x="54" y="324" font-size="14.5" fill="#53676d">轻推次数必须有上限；超出上限就停下并报告“未完成”，而不是无限循环。</text><text x="54" y="350" font-size="14.5" fill="#53676d">写入类动作的完成不能只靠模型自述，要用测试或外部检查确认。</text><text x="54" y="378" font-size="14" fill="#c96442">判别规则是 Harness 的启发式，不是模型内部状态。</text></g></svg>
