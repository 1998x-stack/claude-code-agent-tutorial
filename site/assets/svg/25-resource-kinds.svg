<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>围绕 Coding Agent 的社区产出可分为几类</title><desc>源码分析教程、日志可视化与 API 分析、最小化参考实现、协议与插件、外部 CLI 竞品；每类的用途和可信度校验方式不同。</desc><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">社区产出的几类资源：先分清用途，再决定怎么读</text><text x="30" y="68" font-size="14" fill="#53676d">同一篇“Claude Code 分析”，可能是教程、工具或观点，校验方式完全不同。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="108" width="378" height="96" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="52" y="140" font-size="16" font-weight="740" fill="#203035">源码/架构分析</text><text x="52" y="166" font-size="13.5" fill="#53676d">逐文件或按主题解读公开包与文档</text><text x="52" y="190" font-size="13" fill="#c96442">看它是否给出可核对的版本与出处</text><rect x="432" y="108" width="378" height="96" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="454" y="140" font-size="16" font-weight="740" fill="#203035">日志/协议工具</text><text x="454" y="166" font-size="13.5" fill="#53676d">时间线、抓包、token 构成可视化</text><text x="454" y="190" font-size="13" fill="#c96442">看它解析的字段是否与你所用版本一致</text><rect x="30" y="220" width="378" height="96" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="52" y="252" font-size="16" font-weight="740" fill="#203035">最小参考实现</text><text x="52" y="278" font-size="13.5" fill="#53676d">用几百到千行复现 Agent 核心模式</text><text x="52" y="302" font-size="13" fill="#c96442">看它是否带测试与真实可运行步骤</text><rect x="432" y="220" width="378" height="96" rx="12" fill="#eef5f2" stroke="#a9b8b4" stroke-width="1.6"/><text x="454" y="252" font-size="16" font-weight="740" fill="#203035">协议与插件（MCP 等）</text><text x="454" y="278" font-size="13.5" fill="#53676d">扩展工具集成的标准协议与服务器</text><text x="454" y="302" font-size="13" fill="#c96442">看它是否声明协议版本与传输方式</text><rect x="30" y="332" width="780" height="70" rx="12" fill="#fff" stroke="#dce6e2"/><text x="52" y="362" font-size="14.5" fill="#53676d">外部 CLI 竞品（不同供应商）</text><text x="52" y="386" font-size="13" fill="#c96442">描述能力时以官方文档为准；窗口大小/价格/模型名随版本变化，不写死。</text></g></svg>
