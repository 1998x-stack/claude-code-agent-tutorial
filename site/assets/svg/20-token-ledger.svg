<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>同一个实验里的“输入 token”与“缓存 token”不是同一笔账</title><desc>教学数据：22k 输入，工具定义延迟 3k、清理陈旧结果 4k；缓存只标识复用部分。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">同一个实验里的“输入 token”与“缓存 token”不是同一笔账</text><text x="30" y="68" font-size="14" fill="#53676d">教学数据：22k 输入，工具定义延迟 3k、清理陈旧结果 4k；缓存只标识复用部分。</text><path d="M30 83H810" stroke="#dce6e2"/><text x="38" y="130" fill="#203035" font-size="17" font-weight="740">基线 22,000</text><rect x="38" y="147" width="760" height="63" rx="8" fill="#fff" stroke="#dce6e2"/><rect x="38" y="150" width="103" height="57" rx="5" fill="#bfe5dc"/><text x="89.5" y="183" text-anchor="middle" fill="#203035" font-size="12.5">系统 3k</text><rect x="141" y="150" width="173" height="57" rx="5" fill="#e2dcf4"/><text x="227.5" y="183" text-anchor="middle" fill="#203035" font-size="12.5">Schema 5k</text><rect x="314" y="150" width="276" height="57" rx="5" fill="#f9ddce"/><text x="452" y="183" text-anchor="middle" fill="#203035" font-size="12.5">历史 8k</text><rect x="590" y="150" width="208" height="57" rx="5" fill="#dce6e2"/><text x="694" y="183" text-anchor="middle" fill="#203035" font-size="12.5">旧结果 6k</text><text x="38" y="257" fill="#203035" font-size="17" font-weight="740">减少输入后 15,000</text><rect x="38" y="272" width="518" height="65" rx="8" fill="#fff" stroke="#dce6e2"/><rect x="38" y="275" width="103" height="59" rx="5" fill="#bfe5dc"/><text x="89.5" y="310" text-anchor="middle" fill="#203035" font-size="12">系统 3k</text><rect x="141" y="275" width="69" height="59" rx="5" fill="#e2dcf4"/><text x="175.5" y="310" text-anchor="middle" fill="#203035" font-size="12">Schema 2k</text><rect x="210" y="275" width="276" height="59" rx="5" fill="#f9ddce"/><text x="348" y="310" text-anchor="middle" fill="#203035" font-size="12">历史 8k</text><rect x="486" y="275" width="70" height="59" rx="5" fill="#dce6e2"/><text x="521" y="310" text-anchor="middle" fill="#203035" font-size="12">结果 2k</text><text x="595" y="296" font-size="18" font-weight="750" fill="#147f80">−7,000</text><text x="595" y="318" font-size="14" fill="#53676d">输入上下文</text><text x="418" y="384" font-size="14" text-anchor="middle" fill="#53676d">缓存读取量单独记录；不能再减去 15k 中的 cached tokens。</text></g></svg>