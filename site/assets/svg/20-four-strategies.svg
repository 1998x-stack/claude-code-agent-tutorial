<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>上下文压力的四种来源，对应四类工程手段</title><desc>少加载 Tool Schema、减少中间结果、复用缓存前缀、清理陈旧历史，各自作用不同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">上下文压力的四种来源，对应四类工程手段</text><text x="30" y="68" font-size="14" fill="#53676d">少加载 Tool Schema、减少中间结果、复用缓存前缀、清理陈旧历史，各自作用不同。</text><path d="M30 83H810" stroke="#dce6e2"/><rect x="28" y="112" width="182" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="119" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Tool Search</text><text x="119" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">减少初始定义</text><rect x="235" y="112" width="182" height="85" rx="11" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="326" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Programmatic</text><text x="326" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">减少工具往返</text><rect x="443" y="112" width="182" height="85" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.5"/><text x="534" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Prompt Cache</text><text x="534" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">降低重复前缀成本</text><rect x="651" y="112" width="161" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="731.5" y="141" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Context Edit</text><text x="731.5" y="169" text-anchor="middle" font-size="13.5" fill="#53676d">清理过期结果</text><rect x="28" y="251" width="783" height="129" rx="12" fill="#fff" stroke="#dce6e2"/><text x="50" y="283" font-size="17" font-weight="750" fill="#203035">不要混淆目标指标</text><text x="50" y="312" font-size="14.5" fill="#53676d">Tool Search / Context Edit：可以减少进入当前上下文的输入 token。</text><text x="50" y="337" font-size="14.5" fill="#53676d">Prompt Cache：重用相同前缀以优化处理成本，不等于缩小上下文窗口。</text><text x="50" y="362" font-size="14" fill="#c96442">Compaction：可保留长期目标但也可能丢失关键事实，必须额外验证。</text></g></svg>