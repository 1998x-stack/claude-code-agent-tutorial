<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>权限是逐个具体请求的决定，不是模型自称“已批准”</title><desc>一次审批与工具名、完整参数绑定；拒绝或请求改变时不能被复用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">权限是逐个具体请求的决定，不是模型自称“已批准”</text><text x="30" y="68" font-size="14" fill="#53676d">一次审批与工具名、完整参数绑定；拒绝或请求改变时不能被复用。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="28" y="119" width="182" height="77" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="119" y="148" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Tool Request</text><text x="119" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">名称 + 参数</text><rect x="239" y="119" width="182" height="77" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="330" y="148" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Policy Check</text><text x="330" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">deny / ask / allow</text><rect x="450" y="119" width="182" height="77" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="541" y="148" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Human Approval</text><text x="541" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">匹配摘要 + 身份</text><rect x="660" y="119" width="150" height="77" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.6"/><text x="735" y="148" text-anchor="middle" font-size="17.5" font-weight="750" fill="#203035">Execution</text><text x="735" y="176" text-anchor="middle" font-size="13.5" fill="#53676d">单次授权</text><path d="M212 156H236" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M423 156H447" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M634 156H656" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M728 202V244H118V202" stroke="#147f80" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="418" y="237" text-anchor="middle" fill="#147f80" font-size="14">拒绝与结果必须进入审计 / tool_result</text><rect x="30" y="292" width="778" height="97" rx="12" fill="#fff" stroke="#dce6e2"/><text x="52" y="323" font-size="17" fill="#203035" font-weight="730">错误示例：模型传入 approved: true，就允许 Write</text><text x="52" y="352" font-size="14" fill="#c96442">合法批准只能来自宿主可验证的用户操作，并且不得扩大已有 deny 边界。</text></g></svg>