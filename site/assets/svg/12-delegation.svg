<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>把子任务和证据边界交给独立 Agent</title><desc>分工的目的不是复制主会话，而是得到可验证的局部发现并汇总。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="43" font-size="23" font-weight="750" fill="#203035">把子任务和证据边界交给独立 Agent</text><text x="30" y="68" font-size="14" fill="#53676d">分工的目的不是复制主会话，而是得到可验证的局部发现并汇总。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="115" width="224" height="85" rx="12" fill="#e7f4f0" stroke="#147f80" stroke-width="1.6"/><text x="142" y="146" font-size="18" font-weight="750" text-anchor="middle" fill="#203035">主 Agent</text><text x="142" y="173" font-size="13.5" text-anchor="middle" fill="#53676d">目标 / 安全约束</text><rect x="310" y="115" width="220" height="85" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="420" y="146" font-size="18" font-weight="750" text-anchor="middle" fill="#203035">委派契约</text><text x="420" y="173" font-size="13.5" text-anchor="middle" fill="#53676d">子目标 / 资料 / 限额</text><rect x="586" y="115" width="224" height="85" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="698" y="146" font-size="18" font-weight="750" text-anchor="middle" fill="#203035">子 Agent</text><text x="698" y="173" font-size="13.5" text-anchor="middle" fill="#53676d">限定工具与上下文</text><path d="M256 154H305" stroke="#147f80" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><path d="M532 154H581" stroke="#147f80" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><path d="M701 204V247H138V203" fill="none" stroke="#147f80" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="418" y="241" text-anchor="middle" font-size="14" fill="#147f80">只返回结论 + 引用 + 未解决事项</text><rect x="33" y="291" width="775" height="94" rx="12" fill="#fff" stroke="#dce6e2"/><text x="55" y="322" font-size="17" font-weight="750" fill="#203035">不要把“上下文隔离”误写成“系统安全沙箱”</text><text x="55" y="353" font-size="14" fill="#53676d">共享进程、工作目录或权限时，模型上下文不同并不能保证文件、网络和密钥隔离。</text></g></svg>