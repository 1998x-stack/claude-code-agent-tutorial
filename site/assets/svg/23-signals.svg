<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>日志、事件、指标与 Trace 各自回答不同的问题</title><desc>将持续时间操作建成 Span；瞬时状态变化用 Event；聚合数值用 Metric。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">日志、事件、指标与 Trace 各自回答不同的问题</text><text x="30" y="68" font-size="14" fill="#53676d">将持续时间操作建成 Span；瞬时状态变化用 Event；聚合数值用 Metric。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="32" y="115" width="180" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="122" y="144" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Logs</text><text x="122" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">人类诊断细节</text><rect x="236" y="115" width="180" height="85" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="326" y="144" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Events</text><text x="326" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">一次状态变化</text><rect x="440" y="115" width="180" height="85" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="530" y="144" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Metrics</text><text x="530" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">计数 / 分布</text><rect x="644" y="115" width="164" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="726" y="144" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Traces</text><text x="726" y="172" text-anchor="middle" font-size="13.5" fill="#53676d">跨步骤因果</text><rect x="32" y="270" width="776" height="112" rx="12" fill="#fff" stroke="#dce6e2"/><text x="55" y="302" font-size="17" font-weight="750" fill="#203035">关键关联字段</text><text x="55" y="333" font-size="14" fill="#53676d">trace_id：整条任务；span_id / parent_span_id：操作层级。</text><text x="55" y="359" font-size="14" fill="#53676d">request_id：API 请求；tool_use_id：模型请求的具体工具调用。</text></g></svg>