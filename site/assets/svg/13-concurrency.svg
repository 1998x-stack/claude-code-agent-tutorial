<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>并行完成顺序可能不同，汇报顺序应可预测</title><desc>同一批作业的开始和完成时间因 I/O 不同而变化；输出仍按提交顺序归并。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">并行完成顺序可能不同，汇报顺序应可预测</text><text x="30" y="68" font-size="14" fill="#53676d">同一批作业的开始和完成时间因 I/O 不同而变化；输出仍按提交顺序归并。</text><path d="M30 83H808" stroke="#dce6e2"/><rect x="34" y="117" width="770" height="244" rx="13" fill="#fff" stroke="#dce6e2"/><text x="58" y="148" font-size="16" font-weight="740" fill="#203035">时间 →</text><path d="M188 142H772" stroke="#53676d" stroke-width="1.5"/><text x="63" y="200" font-size="17" fill="#203035">alpha</text><rect x="185" y="177" width="125" height="33" rx="6" fill="#b8e4dc"/><text x="195" y="199" font-size="13.5" fill="#203035">scheduled task</text><text x="63" y="252" font-size="17" fill="#203035">beta</text><rect x="185" y="229" width="395" height="33" rx="6" fill="#e1daf4"/><text x="195" y="251" font-size="13.5" fill="#203035">scheduled task</text><text x="63" y="304" font-size="17" fill="#203035">gamma</text><rect x="316" y="281" width="344" height="33" rx="6" fill="#f7dbcc"/><text x="326" y="303" font-size="13.5" fill="#203035">scheduled task</text><rect x="56" y="337" width="706" height="52" rx="10" fill="#eaf5f2"/><text x="410" y="369" text-anchor="middle" font-size="14" fill="#203035">最终数组顺序：alpha → beta → gamma；失败作为独立 Outcome 保留。</text></g></svg>