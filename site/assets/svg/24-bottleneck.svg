<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>先定位瓶颈，再选择优化杠杆</title><desc>端到端时间来自模型等待、工具执行、排队与上下文处理；应分别测量。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">先定位瓶颈，再选择优化杠杆</text><text x="30" y="68" font-size="14" fill="#53676d">端到端时间来自模型等待、工具执行、排队与上下文处理；应分别测量。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="116" width="182" height="84" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="121" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Model API</text><text x="121" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">TTFT + generation</text><rect x="235" y="116" width="182" height="84" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="326" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Tool Runtime</text><text x="326" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">I/O + subprocess</text><rect x="440" y="116" width="182" height="84" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="531" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Queue / Wait</text><text x="531" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">concurrency + limits</text><rect x="645" y="116" width="165" height="84" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="727.5" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Context</text><text x="727.5" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">tokens + cache</text><rect x="30" y="270" width="780" height="107" rx="12" fill="#fff" stroke="#dce6e2"/><text x="53" y="302" font-size="17" font-weight="750" fill="#203035">优化前先建立基线</text><text x="53" y="331" font-size="14" fill="#53676d">质量：任务通过率与回归；延迟：P50/P95；成本：真实 usage；安全：拒绝与错误。</text><text x="53" y="356" font-size="14" fill="#c96a4a">一次只改一个因素，确认收益不是质量或安全回归的代价。</text></g></svg>