<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>上下文、工具权限与工作区是三个独立的维度</title><desc>子 Agent 可以有独立对话，却仍可能继承宿主的部分访问能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="43" font-size="23" font-weight="750" fill="#203035">上下文、工具权限与工作区是三个独立的维度</text><text x="30" y="68" font-size="14" fill="#53676d">子 Agent 可以有独立对话，却仍可能继承宿主的部分访问能力。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="33" y="119" width="771" height="247" rx="15" fill="#fff" stroke="#dce6e2"/><rect x="55" y="145" width="167" height="50" rx="8" fill="#e6f3f0" stroke="#147f80"/><text x="138" y="175" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">上下文</text><text x="261" y="168" font-size="16" fill="#203035">指定目标、技能与必要材料</text><text x="261" y="189" font-size="13.5" fill="#53676d">会话级输入不同</text><rect x="55" y="215" width="167" height="50" rx="8" fill="#f1eef9" stroke="#7162ad"/><text x="138" y="245" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">能力</text><text x="261" y="238" font-size="16" fill="#203035">工具集合 + 授权规则</text><text x="261" y="259" font-size="13.5" fill="#53676d">由系统与父级约束</text><rect x="55" y="285" width="167" height="50" rx="8" fill="#fff0e8" stroke="#c96442"/><text x="138" y="315" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">资源</text><text x="261" y="308" font-size="16" fill="#203035">文件系统 / 网络 / 凭证</text><text x="261" y="329" font-size="13.5" fill="#53676d">必须额外执行隔离</text><text x="419" y="391" font-size="13.5" fill="#53676d" text-anchor="middle">“新上下文”不自动意味着“新进程”或“新工作树”，官方不同代理类型的行为有差异。</text></g></svg>