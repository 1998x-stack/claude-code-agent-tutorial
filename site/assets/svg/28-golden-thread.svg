<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>全课程金线：从 Agent Loop 到完整系统</title><desc>主循环 → 工具 → 规划 → 上下文，再到子代理、安全、MCP、技能、可观测性与完整系统；每一步为下一步提供地基。</desc><defs><marker id="a28" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">金线：每一章都是前一章的延伸</text><text x="30" y="68" font-size="14" fill="#53676d">沿着这条线重读，比跳跃式阅读更容易建立整体认知。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="46" y="128" width="150" height="52" rx="10" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="121" y="159" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Agent Loop</text><rect x="232" y="128" width="150" height="52" rx="10" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="307" y="159" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Tools</text><rect x="418" y="128" width="150" height="52" rx="10" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="493" y="159" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Planning</text><rect x="604" y="128" width="150" height="52" rx="10" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="679" y="159" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Context</text><path d="M196 154H228" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><path d="M382 154H414" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><path d="M568 154H600" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><text x="420" y="210" font-size="13" fill="#53676d" text-anchor="middle">↓ 有了地基，才谈得上隔离与安全</text><rect x="46" y="232" width="150" height="52" rx="10" fill="#eef5f2" stroke="#a9b8b4" stroke-width="1.6"/><text x="121" y="263" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Sub-Agents</text><rect x="232" y="232" width="150" height="52" rx="10" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="307" y="263" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Security</text><rect x="418" y="232" width="150" height="52" rx="10" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="493" y="263" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">MCP</text><rect x="604" y="232" width="150" height="52" rx="10" fill="#f3eefb" stroke="#7162ad" stroke-width="1.6"/><text x="679" y="263" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Skills</text><path d="M196 258H228" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><path d="M382 258H414" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><path d="M568 258H600" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><rect x="180" y="314" width="210" height="52" rx="10" fill="#fceee6" stroke="#c96442" stroke-width="1.6"/><text x="285" y="345" font-size="14" font-weight="740" fill="#203035" text-anchor="middle">Observability</text><rect x="440" y="314" width="260" height="52" rx="10" fill="#e6f3f0" stroke="#147f80" stroke-width="1.8"/><text x="570" y="345" font-size="14.5" font-weight="740" fill="#203035" text-anchor="middle">完整可运行的系统</text><path d="M390 340H436" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#a28)"/><text x="420" y="398" font-size="12.5" fill="#53676d" text-anchor="middle">从“能跑的最小循环”补到“可审计、可恢复、可扩展的完整系统”。</text></g></svg>
