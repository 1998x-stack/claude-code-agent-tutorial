<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>工程质量闭环：每一项控制都有可测证据</title><desc>把工具使用、权限、会话、验证、可观测性连接成一个具体交付契约。</desc><defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">工程质量闭环：每一项控制都有可测证据</text><text x="30" y="68" font-size="14" fill="#53676d">把工具使用、权限、会话、验证、可观测性连接成一个具体交付契约。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="112" width="175" height="79" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="117.5" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">1 Scope</text><text x="117.5" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">task contract</text><rect x="231" y="112" width="175" height="79" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="318.5" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">2 Execute</text><text x="318.5" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">safe tools / budget</text><rect x="432" y="112" width="175" height="79" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="519.5" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">3 Validate</text><text x="519.5" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">tests + diffs</text><rect x="633" y="112" width="177" height="79" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="721.5" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">4 Approve</text><text x="721.5" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">human / policy</text><path d="M208 151H226" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M409 151H427" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M611 151H628" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M722 196V237H117V195" stroke="#147f80" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#f)"/><text x="418" y="228" text-anchor="middle" font-size="14" fill="#147f80">失败 → 修复/回滚/升级；不把失败结果改写成通过</text><rect x="30" y="277" width="780" height="108" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="310" font-size="17" font-weight="750" fill="#203035">横切边界：Trace + Checkpoint + Authorization</text><text x="54" y="340" font-size="14" fill="#53676d">记录请求/工具关联；跨会话保存精确修订和验收证据；写入需要批准。</text><text x="54" y="367" font-size="14" fill="#c96a4a">浏览器、文件系统、网络、模型 API 与部署各自拥有不同的故障模式。</text></g></svg>