<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>长任务需要两种记忆：原始历史与恢复检查点</title><desc>历史是观察到的完整事件；检查点是可审核的任务状态，二者不能相互冒充。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">长任务需要两种记忆：原始历史与恢复检查点</text><text x="30" y="68" font-size="14" fill="#53676d">历史是观察到的完整事件；检查点是可审核的任务状态，二者不能相互冒充。</text><path d="M30 83H810" stroke="#dce6e2"/><rect x="28" y="116" width="240" height="83" rx="12" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="148" y="147" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">短期上下文</text><text x="148" y="175" text-anchor="middle" font-size="13.3" fill="#53676d">当前消息 / 工具结果</text><rect x="300" y="116" width="240" height="83" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="420" y="147" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">外部事件记录</text><text x="420" y="175" text-anchor="middle" font-size="13.3" fill="#53676d">原始日志与来源索引</text><rect x="571" y="116" width="239" height="83" rx="12" fill="#fff1e9" stroke="#c96442" stroke-width="1.5"/><text x="690.5" y="147" text-anchor="middle" font-size="18" font-weight="750" fill="#203035">结构化检查点</text><text x="690.5" y="175" text-anchor="middle" font-size="13.3" fill="#53676d">目标 / 约束 / 待办</text><path d="M270 157H297" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M542 157H568" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M691 204V243H144V202" fill="none" stroke="#147f80" stroke-dasharray="7 5" stroke-width="2.6" marker-end="url(#arrow)"/><text x="410" y="237" font-size="14" text-anchor="middle" fill="#147f80">恢复时核对证据，而非直接相信摘要</text><rect x="32" y="290" width="776" height="95" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="320" font-size="17" font-weight="750" fill="#203035">数据所有权</text><text x="54" y="350" font-size="14.5" fill="#53676d">检查点不应该持有 API Key；事件记录必须有权限、保留期限和脱敏策略。</text></g></svg>