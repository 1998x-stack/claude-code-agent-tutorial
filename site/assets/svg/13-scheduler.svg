<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>派发、执行与验收必须分离</title><desc>调度器管理并行上界和结果归并；单个 worker 不应有越权执行权。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">派发、执行与验收必须分离</text><text x="30" y="68" font-size="14" fill="#53676d">调度器管理并行上界和结果归并；单个 worker 不应有越权执行权。</text><path d="M30 83H808" stroke="#dce6e2"/><rect x="28" y="117" width="207" height="82" rx="11" fill="#e5f3f0" stroke="#147f80" stroke-width="1.5"/><text x="131.5" y="148" text-anchor="middle" font-size="17.5" fill="#203035" font-weight="740">父任务</text><text x="131.5" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">定义独立子目标</text><rect x="315" y="117" width="207" height="82" rx="11" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="418.5" y="148" text-anchor="middle" font-size="17.5" fill="#203035" font-weight="740">限额调度器</text><text x="418.5" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">max_workers + job ID</text><rect x="602" y="117" width="207" height="82" rx="11" fill="#fff0e8" stroke="#c96442" stroke-width="1.5"/><text x="705.5" y="148" text-anchor="middle" font-size="17.5" fill="#203035" font-weight="740">独立 Worker</text><text x="705.5" y="175" text-anchor="middle" font-size="13.5" fill="#53676d">只读模拟研究</text><path d="M238 157H310" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a)"/><path d="M525 157H598" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a)"/><path d="M702 201V246H132V202" stroke="#147f80" stroke-width="2.6" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/><text x="418" y="238" text-anchor="middle" font-size="14" fill="#147f80">Outcome(status, evidence, error)</text><rect x="30" y="289" width="780" height="96" rx="12" fill="#fff" stroke="#dce6e2"/><text x="54" y="320" font-weight="740" font-size="17" fill="#203035">合并前校验报告属于目标 Agent，来源必须在被委派的范围内</text><text x="54" y="350" font-size="14.5" fill="#53676d">线程只演示并发调度；不提供进程、网络、文件或租户之间的安全隔离。</text></g></svg>