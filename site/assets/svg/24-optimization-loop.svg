<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>优化必须先有基线，再定位瓶颈并重新测量</title><desc>四步循环：用同一任务集测量基线、定位最慢环节、做单点优化、用同样方法复测；不可比的任务集会让数据失效。</desc><defs><marker id="a24" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">优化是一个闭环，不是一次性的“调参”</text><text x="30" y="68" font-size="14" fill="#53676d">每一轮只改一个因素，并用同一任务集对比前后。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="46" y="120" width="200" height="78" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="146" y="152" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">1 测量基线</text><text x="146" y="176" font-size="13" fill="#53676d" text-anchor="middle">token/延迟/成功率</text><rect x="300" y="120" width="200" height="78" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="400" y="152" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">2 定位瓶颈</text><text x="400" y="176" font-size="13" fill="#53676d" text-anchor="middle">最慢的一环</text><rect x="554" y="120" width="240" height="78" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="674" y="152" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">3 单点优化</text><text x="674" y="176" font-size="13" fill="#53676d" text-anchor="middle">一次只改一个因素</text><path d="M248 159H296" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a24)"/><path d="M502 159H550" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a24)"/><path d="M674 200V252H146V202" stroke="#147f80" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#a24)"/><text x="410" y="244" font-size="13" fill="#53676d" text-anchor="middle">4 同样方法复测，未达预期则回到第 2 步</text><rect x="46" y="272" width="748" height="118" rx="12" fill="#fff" stroke="#dce6e2"/><text x="68" y="304" font-size="16.5" font-weight="740" fill="#203035">最常见的错误：拿不可比的两组数据下结论</text><text x="68" y="334" font-size="14" fill="#53676d">优化前跑“修个 typo”，优化后跑“重构整个模块”，前后数字没有可比性。</text><text x="68" y="360" font-size="14" fill="#53676d">固定模型与版本、提示词、任务集、工具授权与网络环境，再谈提升。</text><text x="68" y="384" font-size="13" fill="#c96442">本章不给统一百分比：收益随任务、模型与用量强烈变化。</text></g></svg>
