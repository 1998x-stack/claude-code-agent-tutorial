<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>筛选社区资源的三道可验证性问题</title><desc>有没有贴出可运行的代码、有没有可复现的实验与数据、有没有标明版本与出处；三选二才值得投入时间。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">读之前先问三个问题，避免“收藏了就等于学会”</text><text x="30" y="68" font-size="14" fill="#53676d">信息密度可以用三个可验证的信号来筛。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="46" y="120" width="230" height="180" rx="14" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="161" y="162" font-size="30" font-weight="740" fill="#147f80" text-anchor="middle">1</text><text x="161" y="200" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">有可运行代码？</text><text x="161" y="230" font-size="13.5" fill="#53676d" text-anchor="middle">能否按步骤跑起来</text><text x="161" y="258" font-size="13.5" fill="#53676d" text-anchor="middle">带测试或断言吗</text><rect x="306" y="120" width="230" height="180" rx="14" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="421" y="162" font-size="30" font-weight="740" fill="#7162ad" text-anchor="middle">2</text><text x="421" y="200" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">有可复现数据？</text><text x="421" y="230" font-size="13.5" fill="#53676d" text-anchor="middle">实验设置写清楚吗</text><text x="421" y="258" font-size="13.5" fill="#53676d" text-anchor="middle">能重跑出同样结论吗</text><rect x="566" y="120" width="228" height="180" rx="14" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="680" y="162" font-size="30" font-weight="740" fill="#c96442" text-anchor="middle">3</text><text x="680" y="200" font-size="17" font-weight="740" fill="#203035" text-anchor="middle">标了版本/出处？</text><text x="680" y="230" font-size="13.5" fill="#53676d" text-anchor="middle">有没有日期与链接</text><text x="680" y="258" font-size="13.5" fill="#53676d" text-anchor="middle">能否追到一手文档</text><rect x="46" y="322" width="748" height="74" rx="12" fill="#fff" stroke="#dce6e2"/><text x="68" y="352" font-size="15" font-weight="740" fill="#203035">经验法则：三个里命中两个就值得读；一个都没有就当作观点。</text><text x="68" y="378" font-size="13" fill="#c96442">本页不给具体仓库的章节数、星标数或价格对比——这些数字会变化且难以当场核实。</text></g></svg>
