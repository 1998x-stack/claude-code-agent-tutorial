<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>安装一个 Plugin，相当于引入可执行代码和会话指令</title><desc>Marketplace 只告诉你目录来源；它不证明目录中每个插件安全。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">安装一个 Plugin，相当于引入可执行代码和会话指令</text><text x="30" y="68" font-size="14" fill="#53676d">Marketplace 只告诉你目录来源；它不证明目录中每个插件安全。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="28" y="113" width="178" height="80" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="117" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Marketplace</text><text x="117" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">publisher / source</text><rect x="237" y="113" width="178" height="80" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="326" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Plugin Package</text><text x="326" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">skills + agents + hooks</text><rect x="446" y="113" width="178" height="80" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="535" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Runtime Effects</text><text x="535" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">shell / MCP / mods</text><rect x="655" y="113" width="155" height="80" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="732.5" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">User Context</text><text x="732.5" y="170" text-anchor="middle" font-size="13.5" fill="#53676d">data + credentials</text><path d="M208 153H232" stroke="#147f80" stroke-width="2.5" fill="none" marker-end=