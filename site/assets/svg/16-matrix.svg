<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>同一工具在不同条件下的策略结果</title><desc>教材 Policy 的三种结果：allow、ask、deny；每个结果都要解释原因。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">同一工具在不同条件下的策略结果</text><text x="30" y="68" font-size="14" fill="#53676d">教材 Policy 的三种结果：allow、ask、deny；每个结果都要解释原因。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="35" y="111" width="772" height="252" rx="12" fill="#fff" stroke="#dce6e2"/><rect x="49" y="135" width="174" height="40" rx="5" fill="#e4f2ee" stroke="#e0e9e5"/><text x="61" y="160" fill="#203035" font-size="15" font-weight="750">工具请求</text><rect x="226" y="135" width="171" height="40" rx="5" fill="#e4f2ee" stroke="#e0e9e5"/><text x="238" y="160" fill="#203035" font-size="15" font-weight="750">显式规则</text><rect x="397" y="135" width="180" height="40" rx="5" fill="#e4f2ee" stroke="#e0e9e5"/><text x="409" y="160" fill="#203035" font-size="15" font-weight="750">没有批准</text><rect x="577" y="135" width="210" height="40" rx="5" fill="#e4f2ee" stroke="#e0e9e5"/><text x="589" y="160" fill="#203035" font-size="15" font-weight="750">有人批准</text><rect x="49" y="179" width="174" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="61" y="204" fill="#53676d" font-size="14" font-weight="450">Read</text><rect x="226" y="179" width="171" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="238" y="204" fill="#53676d" font-size="14" font-weight="450">allow</text><rect x="397" y="179" width="180" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="409" y="204" fill="#53676d" font-size="14" font-weight="450">ALLOW</text><rect x="577" y="179" width="210" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="589" y="204" fill="#53676d" font-size="14" font-weight="450">ALLOW</text><rect x="49" y="223" width="174" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="61" y="248" fill="#53676d" font-size="14" font-weight="450">Edit</text><rect x="226" y="223" width="171" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="238" y="248" fill="#53676d" font-size="14" font-weight="450">ask</text><rect x="397" y="223" width="180" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="409" y="248" fill="#53676d" font-size="14" font-weight="450">ASK</text><rect x="577" y="223" width="210" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="589" y="248" fill="#53676d" font-size="14" font-weight="450">ALLOW（本次）</text><rect x="49" y="267" width="174" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="61" y="292" fill="#53676d" font-size="14" font-weight="450">Write</text><rect x="226" y="267" width="171" height="40" rx="5" fill="#fff" stroke="#e0e9e5"/><text x="238" y="292" fill="#53676d" font-size="14" font-weight="450">deny</text><rect x="397" y="267" width="180" height="40" rx="5" fill="#fff0e8" stroke="#e0e9e5"/><text x="409" y="292" fill="#53676d" font-size="14" font-weight="450">DENY</text><rect x="577" y="267" width="210" height="40" rx="5" fill="#fff0e8" stroke="#e0e9e5"/><text x="589" y="292" fill="#53676d" font-size="14" font-weight="450">DENY</text><rect x="49" y="311" width="174" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="61" y="336" fill="#53676d" font-size="14" font-weight="450">未知工具</text><rect x="226" y="311" width="171" height="40" rx="5" fill="#f7faf8" stroke="#e0e9e5"/><text x="238" y="336" fill="#53676d" font-size="14" font-weight="450">未注册</text><rect x="397" y="311" width="180" height="40" rx="5" fill="#fff0e8" stroke="#e0e9e5"/><text x="409" y="336" fill="#53676d" font-size="14" font-weight="450">DENY</text><rect x="577" y="311" width="210" height="40" rx="5" fill="#fff0e8" stroke="#e0e9e5"/><text x="589" y="336" fill="#53676d" font-size="14" font-weight="450">DENY</text><text x="420" y="394" text-anchor="middle" fill="#53676d" font-size="14">政策评估 ≠ 沙箱边界 ≠ 操作已执行；这是显式的三道不同职责。</text></g></svg>