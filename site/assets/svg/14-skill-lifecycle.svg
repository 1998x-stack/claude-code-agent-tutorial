<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>先发现技能的描述，再按需加载完整 SKILL.md</title><desc>按任务选择能减少无关上下文；执行授权仍遵循平台权限策略。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">先发现技能的描述，再按需加载完整 SKILL.md</text><text x="30" y="68" font-size="14" fill="#53676d">按任务选择能减少无关上下文；执行授权仍遵循平台权限策略。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="30" y="116" width="221" height="81" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="140.5" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Discovery</text><text x="140.5" y="175" font-size="13.5" text-anchor="middle" fill="#53676d">name + description</text><rect x="312" y="116" width="221" height="81" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="422.5" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Invocation</text><text x="422.5" y="175" font-size="13.5" text-anchor="middle" fill="#53676d">指定技能与参数</text><rect x="594" y="116" width="216" height="81" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="702" y="146" font-size="18" font-weight="740" fill="#203035" text-anchor="middle">Instructions</text><text x="702" y="175" font-size="13.5" text-anchor="middle" fill="#53676d">加载内容与资源</text><path d="M254 155H308" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><path d="M536 155H590" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/><rect x="31" y="272" width="779" height="110" rx="12" fill="#fff" stroke="#dce6e2"/><text x="55" y="302" font-size="17" font-weight="740" fill="#203035">官方 Claude Code 的 allowed-tools 是权限字段，不是普通正文</text><text x="55" y="334" font-size="14.5" fill="#53676d">依官方文档，它可能对技能调用当轮的指定工具授予预批准，受权限规则与管理策略约束。</text><text x="55" y="359" font-size="14" fill="#c96442">本章离线 SkillCatalog 忽略该字段，绝不自行动用任何工具。</text></g></svg>