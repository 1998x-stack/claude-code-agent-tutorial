<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>文件修改为何需要多重边界</title><desc>Read / Write / Edit 的路径、批准、内容和原子替换是不同职责。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="16" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">文件修改为何需要多重边界</text><text x="30" y="67" font-size="14" fill="#53676d">Read / Write / Edit 的路径、批准、内容和原子替换是不同职责。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="31" y="111" width="172" height="82" rx="12" fill="#e1f3ef" stroke="#147f80" stroke-width="1.5"/><text x="117" y="140" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">路径定位</text><text x="117" y="164" text-anchor="middle" font-size="13" fill="#53676d">相对路径 / 禁止 ..</text><rect x="229" y="111" width="172" height="82" rx="12" fill="#fff" stroke="#aacdc4" stroke-width="1.5"/><text x="315" y="140" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">目标检查</text><text x="315" y="164" text-anchor="middle" font-size="13" fill="#53676d">禁私密路径与链接</text><rect x="427" y="111" width="172" height="82" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.5"/><text x="513" y="140" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">明确批准</text><text x="513" y="164" text-anchor="middle" font-size="13" fill="#53676d">写入 / 编辑权限</text><rect x="625" y="111" width="182" height="82" rx="12" fill="#fff0e9" stroke="#c96442" stroke-width="1.5"/><text x="716" y="140" text-anchor="middle" font-size="17.5" font-weight="720" fill="#203035">受控写入</text><text x="716" y="164" text-anchor="middle" font-size="13" fill="#53676d">同目录临时文件</text><path d="M204 154H225" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M402 154H423" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M600 154H621" stroke="#147f80" stroke-width="2.8" fill="none" marker-end="url(#a)"/><rect x="31" y="244" width="773" height="127" rx="13" fill="#fff" stroke="#dce6e2"/><text x="55" y="275" font-size="16" font-weight="700" fill="#203035">Edit 的额外不变量</text><text x="55" y="303" font-size="14.5" fill="#53676d">old_text 必须非空且在文件内恰好出现一次，否则拒绝，而不是猜测替换位置。</text><text x="55" y="331" font-size="14.5" fill="#53676d">os.replace 能降低半写入风险，但不能防止目录并发替换（TOCTOU）或宿主权限逃逸。</text><text x="55" y="358" font-size="14" fill="#c96442">真实执行请再使用沙箱、最小权限、审批和独立工作区。</text></g></svg>