<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Harness 的控制流由依赖与反馈决定</title><desc>五种常见工作流是可组合积木；并非一个虚构的模型代际或完成模式排名。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">Harness 的控制流由依赖与反馈决定</text><text x="30" y="68" font-size="14" fill="#53676d">五种常见工作流是可组合积木；并非一个虚构的模型代际或完成模式排名。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="26" y="133" width="145" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="98.5" y="163" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Sequential</text><text x="98.5" y="191" text-anchor="middle" font-size="13.5" fill="#53676d">A → B → C</text><rect x="188" y="133" width="145" height="85" rx="11" fill="#f1eef9" stroke="#147f80" stroke-width="1.5"/><text x="260.5" y="163" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Routing</text><text x="260.5" y="191" text-anchor="middle" font-size="13.5" fill="#53676d">分类 → 专家</text><rect x="350" y="133" width="145" height="85" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="422.5" y="163" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Parallel</text><text x="422.5" y="191" text-anchor="middle" font-size="13.5" fill="#53676d">Fan-out → Join</text><rect x="512" y="133" width="145" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="584.5" y="163" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Orchestrator</text><text x="584.5" y="191" text-anchor="middle" font-size="13.5" fill="#53676d">动态拆分</text><rect x="674" y="133" width="145" height="85" rx="11" fill="#f1eef9" stroke="#147f80" stroke-width="1.5"/><text x="746.5" y="163" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Evaluator</text><text x="746.5" y="191" text-anchor="middle" font-size="13.5" fill="#53676d">生成 ↔ 评估</text><rect x="30" y="281" width="780" height="100" rx="12" fill="#fff" stroke="#dce6e2"/><text x="52" y="312" font-size="17" font-weight="750" fill="#203035">选择规则</text><text x="52" y="341" font-size="14" fill="#53676d">默认单 Agent / 顺序流程；只有当独立性、质量收益或延迟收益可测时才增加并行或评估器。</text><text x="52" y="365" font-size="14" fill="#c96a4a">并行增加资源成本；Evaluator-Optimizer 必须有阈值与轮数上限。</text></g></svg>