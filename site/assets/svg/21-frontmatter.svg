<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Frontmatter 字段控制的是不同维度</title><desc>调用入口、模型自动发现、执行上下文与工具权限不能合并成一个 trigger。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">Frontmatter 字段控制的是不同维度</text><text x="30" y="68" font-size="14" fill="#53676d">调用入口、模型自动发现、执行上下文与工具权限不能合并成一个 trigger。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="35" y="115" width="240" height="85" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="155" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Invocation</text><text x="155" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">user-invocable</text><rect x="300" y="115" width="240" height="85" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="420" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Model Discovery</text><text x="420" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">disable-model-invocation</text><rect x="565" y="115" width="240" height="85" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="685" y="145" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">Execution Context</text><text x="685" y="173" text-anchor="middle" font-size="13.5" fill="#53676d">context: fork</text><path d="M155 201V254H686V201" fill="none" stroke="#147f80" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="35" y="280" width="770" height="100" rx="12" fill="#fff" stroke="#dce6e2"/><text x="58" y="310" font-size="17" font-weight="750" fill="#203035">另一个独立字段：allowed-tools</text><text x="58" y="340" font-size="14" fill="#53676d">仅在调用该 Skill 的 turn 内预授权列出的工具；不是全局 allowlist。</text><text x="58" y="363" font-size="14" fill="#c96a4a">声明字段 ≠ 自定义 SkillCatalog 自动获得真实 Claude Code 权限。</text></g></svg>