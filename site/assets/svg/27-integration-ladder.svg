<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>十步集成，每步都用最小可逆任务验证</title><desc>从主循环、工具、规划、上下文、子代理、权限、MCP、技能到可观测性与配置，每一步只加一个模块并用最小可逆任务确认。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">一次只加一个模块，加完立刻验证</text><text x="30" y="68" font-size="14" fill="#53676d">“最小”= 花最少 token 确认功能；“可逆”= 不损坏项目，最好是临时文件。</text><path d="M30 84H810" stroke="#dce6e2"/><text x="40" y="118" font-size="13.5" fill="#203035">1 主循环</text><rect x="150" y="102" width="60" height="22" rx="5" fill="#bde6df"/><text x="40" y="152" font-size="13.5" fill="#203035">2 工具注册</text><rect x="150" y="136" width="110" height="22" rx="5" fill="#bde6df"/><text x="40" y="186" font-size="13.5" fill="#203035">3 Todo 规划</text><rect x="150" y="170" width="150" height="22" rx="5" fill="#cfd9f4"/><text x="40" y="220" font-size="13.5" fill="#203035">4 上下文</text><rect x="150" y="204" width="185" height="22" rx="5" fill="#cfd9f4"/><text x="40" y="254" font-size="13.5" fill="#203035">5 子代理</text><rect x="150" y="238" width="220" height="22" rx="5" fill="#e3ddf4"/><text x="40" y="288" font-size="13.5" fill="#203035">6 权限链</text><rect x="150" y="272" width="255" height="22" rx="5" fill="#f9dccb"/><text x="40" y="322" font-size="13.5" fill="#203035">7 MCP</text><rect x="150" y="306" width="290" height="22" rx="5" fill="#f9dccb"/><text x="40" y="356" font-size="13.5" fill="#203035">8 Skills</text><rect x="150" y="340" width="320" height="22" rx="5" fill="#f2e0d6"/><text x="40" y="390" font-size="13.5" fill="#203035">9 可观测 / 10 配置 CLI</text><rect x="150" y="374" width="380" height="22" rx="5" fill="#f2e0d6"/><text x="536" y="390" font-size="13" fill="#53676d">每步同一顺序：接线 → 最小可逆任务 → 看日志确认</text></g></svg>
