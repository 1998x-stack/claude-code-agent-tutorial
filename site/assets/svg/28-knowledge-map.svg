<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>28 章知识图谱：从模型协议走向可审计的完整系统</title><desc>四个阶段沿依赖关系推进：理解 → 工具与状态 → 安全与扩展 → 长时运行与交付。</desc><defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="750" fill="#203035">28 章知识图谱：从模型协议走向可审计的完整系统</text><text x="30" y="68" font-size="14" fill="#53676d">四个阶段沿依赖关系推进：理解 → 工具与状态 → 安全与扩展 → 长时运行与交付。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="32" y="109" width="364" height="75" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="214" y="139" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">01–08 · Agent Foundations</text><text x="214" y="167" text-anchor="middle" font-size="13.5" fill="#53676d">模型协议、Loop、文件工具、Prompt</text><rect x="444" y="109" width="364" height="75" rx="11" fill="#f1eef9" stroke="#7461ba" stroke-width="1.5"/><text x="626" y="139" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">09–14 · Planning &amp; Delegation</text><text x="626" y="167" text-anchor="middle" font-size="13.5" fill="#53676d">任务 DAG、恢复、Subagents、Skills</text><rect x="32" y="241" width="364" height="75" rx="11" fill="#fff0e9" stroke="#c96a4a" stroke-width="1.5"/><text x="214" y="271" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">15–20 · Execution Controls</text><text x="214" y="299" text-anchor="middle" font-size="13.5" fill="#53676d">权限、沙箱、MCP、上下文工程</text><rect x="444" y="241" width="364" height="75" rx="11" fill="#e4f3ef" stroke="#147f80" stroke-width="1.5"/><text x="626" y="271" text-anchor="middle" font-size="17" font-weight="750" fill="#203035">21–28 · Engineering &amp; Delivery</text><text x="626" y="299" text-anchor="middle" font-size="13.5" fill="#53676d">Skills 实现、Harness、观测、性能、长任务</text><path d="M397 146H439" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M626 187V224H216V237" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><path d="M397 280H439" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#f)"/><text x="420" y="377" text-anchor="middle" font-size="14" fill="#53676d">整条路线依赖外部证据与验收；不能由模型“声称完成”替代测试。</text></g></svg>