<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>跨会话的 Handoff 循环：状态在磁盘上，不在上下文里</title><desc>每次会话从外部检查点开始，读进度与 Git 状态；结束时写回进度并提交；独立评估者用干净上下文判定 PASS/NEEDS_WORK。</desc><defs><marker id="a26" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">跨会话 Handoff：易失的上下文，持久的外部工件</text><text x="30" y="68" font-size="14" fill="#53676d">会话可被重置、机器可重启；磁盘上的进度与提交不会丢。</text><path d="M30 84H810" stroke="#dce6e2"/><rect x="44" y="118" width="220" height="96" rx="12" fill="#e6f3f0" stroke="#147f80" stroke-width="1.6"/><text x="154" y="150" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">新会话启动</text><text x="154" y="178" font-size="13" fill="#53676d" text-anchor="middle">读 PROGRESS + git status</text><text x="154" y="200" font-size="13" fill="#c96442" text-anchor="middle">干净上下文</text><rect x="310" y="118" width="220" height="96" rx="12" fill="#f1eef9" stroke="#7162ad" stroke-width="1.6"/><text x="420" y="150" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">Builder 工作</text><text x="420" y="178" font-size="13" fill="#53676d" text-anchor="middle">改代码，按测试判定结果</text><text x="420" y="200" font-size="13" fill="#c96442" text-anchor="middle">Default-FAIL 起步</text><rect x="576" y="118" width="220" height="96" rx="12" fill="#fff0e8" stroke="#c96442" stroke-width="1.6"/><text x="686" y="150" font-size="16" font-weight="740" fill="#203035" text-anchor="middle">独立评估者</text><text x="686" y="178" font-size="13" fill="#53676d" text-anchor="middle">只读工具，干净上下文</text><text x="686" y="200" font-size="13" fill="#c96442" text-anchor="middle">PASS / NEEDS_WORK</text><path d="M266 166H306" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a26)"/><path d="M532 166H572" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#a26)"/><path d="M686 216V266H154V218" stroke="#147f80" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#a26)"/><text x="420" y="258" font-size="13" fill="#53676d" text-anchor="middle">写回进度 + commit，供下一会话读取</text><rect x="44" y="284" width="752" height="106" rx="12" fill="#fff" stroke="#dce6e2"/><text x="66" y="314" font-size="15.5" font-weight="740" fill="#203035">文件式控制（而非仅信号）</text><text x="66" y="342" font-size="14" fill="#53676d">Kill Switch：出现 AGENT_STOP 文件即停止；Steering：读 STEER 文件调整方向。</text><text x="66" y="368" font-size="14" fill="#53676d">文件是持久的：机器重启后信号文件仍在，Unix 信号则会丢失。</text><text x="66" y="390" font-size="13" fill="#c96442">图为教学设计；文件命名与流程可自行约定，非官方固定实现。</text></g></svg>
