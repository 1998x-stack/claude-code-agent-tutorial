<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>相关度评分按分数从高到低装入，直到预算耗尽</title><desc>技能名精确命中权重高于触发词；分数为零的技能不加载；预算耗尽后更低分的技能被截断。</desc><rect width="840" height="426" rx="14" fill="#f8fbf9"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="23" font-weight="740" fill="#203035">评分排序 + 预算截断决定本轮装哪些技能</text><text x="30" y="68" font-size="14" fill="#53676d">示例：名称精确命中记 2 分，每个触发词记 1 分，再乘优先级系数。</text><path d="M30 84H810" stroke="#dce6e2"/><text x="44" y="126" font-size="15" font-weight="740" fill="#203035">技能</text><text x="300" y="126" font-size="15" font-weight="740" fill="#203035">命中依据</text><text x="560" y="126" font-size="15" font-weight="740" fill="#203035">分数</text><text x="690" y="126" font-size="15" font-weight="740" fill="#203035">预算结果</text><path d="M40 140H800" stroke="#dce6e2"/><text x="44" y="176" font-size="14.5" fill="#203035">python-testing</text><text x="300" y="176" font-size="13.5" fill="#53676d">名称命中 + 触发词</text><text x="560" y="176" font-size="14.5" fill="#203035">2 + 1 = 3.0</text><rect x="686" y="160" width="106" height="26" rx="6" fill="#bde6df"/><text x="739" y="178" font-size="13" fill="#265049" text-anchor="middle">装入</text><text x="44" y="222" font-size="14.5" fill="#203035">git-workflow</text><text x="300" y="222" font-size="13.5" fill="#53676d">单个触发词</text><text x="560" y="222" font-size="14.5" fill="#203035">1.0</text><rect x="686" y="206" width="106" height="26" rx="6" fill="#bde6df"/><text x="739" y="224" font-size="13" fill="#265049" text-anchor="middle">装入</text><text x="44" y="268" font-size="14.5" fill="#203035">docker-deploy</text><text x="300" y="268" font-size="13.5" fill="#53676d">无命中</text><text x="560" y="268" font-size="14.5" fill="#203035">0</text><rect x="686" y="252" width="106" height="26" rx="6" fill="#e3ddf4"/><text x="739" y="270" font-size="13" fill="#51478a" text-anchor="middle">跳过</text><text x="44" y="314" font-size="14.5" fill="#203035">k8s-ops</text><text x="300" y="314" font-size="13.5" fill="#53676d">低频触发词</text><text x="560" y="314" font-size="14.5" fill="#203035">1.0</text><rect x="686" y="298" width="106" height="26" rx="6" fill="#f9dccb"/><text x="739" y="316" font-size="13" fill="#7d3e2a" text-anchor="middle">预算截断</text><rect x="40" y="346" width="760" height="56" rx="10" fill="#fff" stroke="#dce6e2"/><text x="62" y="372" font-size="14" fill="#53676d">分数为 0 直接淘汰；同分时按优先级与最近使用排序，避免“看着相关”就全装。</text><text x="62" y="392" font-size="13" fill="#c96442">表格数值为教学示例，非某次真实加载记录。</text></g></svg>
