<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 426"><title>Messages API 的一轮工具对话</title><desc>关键是 assistant 的 tool_use 块与紧邻的 user.tool_result 按 ID 成对出现。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#147f80"/></marker></defs><rect width="840" height="426" rx="15" fill="#f7faf8"/><g font-family="system-ui,PingFang SC,Arial,sans-serif"><text x="30" y="42" font-size="22" font-weight="750" fill="#203035">Messages API 的一轮工具对话</text><text x="31" y="68" font-size="13.5" fill="#53676d">关键是 assistant 的 tool_use 块与紧邻的 user.tool_result 按 ID 成对出现。</text><path d="M31 83H809" stroke="#dce6e2"/><rect x="31" y="105" width="228" height="85" rx="11" fill="#fff" stroke="#9bbdb6" stroke-width="1.6"/><text x="145" y="136" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">user</text><text x="145" y="162" fill="#53676d" text-anchor="middle" font-size="13.5">请计算 7 + 5</text><rect x="305" y="105" width="228" height="85" rx="11" fill="#e2f3f0" stroke="#147f80" stroke-width="1.6"/><text x="419" y="136" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">assistant</text><text x="419" y="162" fill="#53676d" text-anchor="middle" font-size="13.5">tool_use: add_numbers</text><rect x="579" y="105" width="230" height="85" rx="11" fill="#f1eef8" stroke="#7162ad" stroke-width="1.6"/><text x="694" y="136" fill="#203035" text-anchor="middle" font-size="17.5" font-weight="720">user</text><text x="694" y="162" fill="#53676d" text-anchor="middle" font-size="13.5">tool_result: 12</text><path d="M261 147H301" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M536 147H575" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="32" y="251" width="776" height="118" rx="12" fill="#fff" stroke="#dce6e2"/><text x="52" y="279" font-size="17" font-weight="740" fill="#203035">消息内的关联字段</text><text x="52" y="310" font-size="15" fill="#203035">assistant.content[i] = {type: "tool_use", id: "toolu_...", name, input}</text><text x="52" y="344" font-size="15" fill="#203035">user.content[j]      = {type: "tool_result", tool_use_id: "toolu_...", content}</text></g></svg>