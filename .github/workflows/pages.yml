name: Publish tutorial
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/validate_site.py
      - run: python3 -m unittest discover -s examples -p 'test_*.py'
      - name: Smoke-test offline entry points
        run: |
          python3 examples/long_running_contract.py
          python3 examples/completion_gate.py
          python3 examples/safe_coding_agent.py demo
          python3 examples/permission_gateway.py
          python3 examples/sandbox_manifest.py
          python3 examples/mcp_protocol.py
          python3 -m compileall -q examples tools
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
