name: Validate HTML tutorial
on: [push, pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/validate_site.py
      - run: python3 -m unittest discover -s examples -p 'test_*.py'
      - name: Smoke-test offline entry points
        run: |
          python3 examples/long_running_contract.py
          python3 examples/completion_gate.py
          python3 examples/safe_coding_agent.py demo
          python3 examples/permission_gateway.py
          python3 examples/sandbox_manifest.py
          python3 examples/mcp_protocol.py
          python3 -m compileall -q examples tools

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tools/browser_qa.py --output qa-output
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-browser-qa
          path: qa-output
          if-no-files-found: warn
